    function paginationButtons(page, totalPages, id) {
      const pages = [];
      const add = p => pages.push(`<button class="${p === page ? 'active' : ''}" data-page="${p}">${p}</button>`);
      add(1);
      if (totalPages > 7) {
        if (page > 4) pages.push('<span class="page-ellipsis">…</span>');
        const start = Math.max(2, page - 2), end = Math.min(totalPages - 1, page + 2);
        for (let p = start; p <= end; p++)add(p);
        if (page < totalPages - 3) pages.push('<span class="page-ellipsis">…</span>');
        add(totalPages);
      } else {
        for (let p = 2; p <= totalPages; p++)add(p);
      }
      return pages.join('');
    }

    function table(rows, cols, id, reverse = true) {
      if (!rows?.length) return '<div class="empty">No records available.</div>';
      return `<div id="${id}" class="tbl" data-page="1">
    <div class="tablewrap"><table><thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody></tbody></table></div>
    <div class="pager"><span class="pageinfo"></span><div class="page-buttons"><button class="first">First</button><button class="prev">Previous</button><span class="numbers"></span><button class="next">Next</button><button class="last">Last</button></div></div>
  </div>`;
    }

    function mount(rows, cols, id, reverse = true) {
      const root = $(id); if (!root) return;
      const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
      let page = Math.min(Math.max(+(root.dataset.page || 1), 1), totalPages);
      root.dataset.page = page;
      const ordered = reverse ? rows.slice().reverse() : rows;
      const start = (page - 1) * PAGE_SIZE, end = Math.min(rows.length, start + PAGE_SIZE);
      const slice = ordered.slice(start, end);
      root.querySelector('tbody').innerHTML = slice.map(r => `<tr>${cols.map(c => `<td>${esc(typeof r[c] === 'number' ? Number(r[c]).toLocaleString('en-US', { maximumFractionDigits: 4 }) : r[c])}</td>`).join('')}</tr>`).join('');
      root.querySelector('.pageinfo').textContent = `Showing ${fmt(start + 1)}-${fmt(end)} of ${fmt(rows.length)} records • ${fmt(PAGE_SIZE)} per page`;
      root.querySelector('.first').disabled = page === 1; root.querySelector('.prev').disabled = page === 1;
      root.querySelector('.next').disabled = page === totalPages; root.querySelector('.last').disabled = page === totalPages;
      root.querySelector('.numbers').innerHTML = paginationButtons(page, totalPages, id);
      root.querySelector('.first').onclick = () => { root.dataset.page = 1; mount(rows, cols, id, reverse) };
      root.querySelector('.prev').onclick = () => { root.dataset.page = page - 1; mount(rows, cols, id, reverse) };
      root.querySelector('.next').onclick = () => { root.dataset.page = page + 1; mount(rows, cols, id, reverse) };
      root.querySelector('.last').onclick = () => { root.dataset.page = totalPages; mount(rows, cols, id, reverse) };
      [...root.querySelectorAll('.numbers button')].forEach(b => b.onclick = () => { root.dataset.page = b.dataset.page; mount(rows, cols, id, reverse) });
    }

    function action(i, text) {
      return `<div class="card"><h2>${STAGES[i]}</h2><div class="muted">${text}</div><div class="controls"><button id="run" class="primary">Execute Stage ${i + 1}</button></div></div>`;
    }

    function showTimedProgress(label, duration, onDone) {
      state.running = true;
      const token = ++state.runToken;
      setStatus(label, 'busy');
      const d = document.createElement('div');
      d.className = 'progress';
      d.innerHTML = '<div class="fill"></div><div class="progress-text"></div>';
      $('app').prepend(d);
      const fill = d.querySelector('.fill'), text = d.querySelector('.progress-text'), start = performance.now();

      function tick(now) {
        if (token !== state.runToken) { d.remove(); state.running = false; return }
        const elapsed = now - start, p = Math.min(1, elapsed / duration), remaining = Math.max(0, Math.ceil((duration - elapsed) / 1000));
        fill.style.width = (p * 100) + '%';
        text.textContent = `${label} — ${remaining}s remaining`;
        if (p < 1) { state.animation = requestAnimationFrame(tick); return }
        d.remove();
        state.animation = null;
        onDone(token);
      }
      state.animation = requestAnimationFrame(tick);
    }

    function showObservationHold(stageIndex, token, onDone) {
      if (token !== state.runToken) return;
      setStatus(`Stage ${stageIndex + 1} executed ✓`);
      const hold = document.createElement('div');
      hold.className = 'progress';
      hold.innerHTML = '<div class="fill" style="width:100%"></div><div class="progress-text"><span></span><button id="skipHold" class="secondary" style="padding:2px 8px;font-size:11px">Skip Review &rarr;</button></div>';
      $('app').prepend(hold);
      const textSpan = hold.querySelector('.progress-text span'), skipBtn = hold.querySelector('#skipHold'), start = performance.now();

      let skipped = false;
      if (skipBtn) skipBtn.onclick = () => {
        skipped = true;
        hold.remove();
        state.animation = null;
        state.running = false;
        onDone(token);
      };

      function tick(now) {
        if (skipped || token !== state.runToken) { hold.remove(); state.running = false; return }
        const elapsed = now - start, remaining = Math.max(0, Math.ceil((REVIEW_HOLD_MS - elapsed) / 1000));
        textSpan.textContent = `Stage ${stageIndex + 1} completed — reviewing state for ${remaining}s`;
        if (elapsed < REVIEW_HOLD_MS) { state.animation = requestAnimationFrame(tick); return }
        hold.remove();
        state.animation = null;
        state.running = false;
        onDone(token);
      }
      state.animation = requestAnimationFrame(tick);
    }

    // 3. Strictly Causal Feature Engineering (Zero Lookahead Leakage)
    const FEATURE_NAMES = [
      'amount_log1p', 'balance_orig_diff', 'balance_dest_diff', 'orig_balance_error', 'dest_balance_error',
      'orig_drained', 'hour_of_day', 'type_TRANSFER', 'type_CASH_OUT', 'type_PAYMENT', 'type_DEBIT', 'type_CASH_IN',
      'orig_prior_count', 'orig_prior_mean_amount', 'amount_vs_orig_mean', 'dest_prior_count', 'dest_prior_max_amount',
      'is_new_dest', 'orig_txn_last_24_steps'
    ];

    function expectedBalances(type, oldO, oldD, amount) {
      const safeAmt = Math.abs(+amount || 0);
      const safeOldO = Math.max(0, Number.isFinite(+oldO) ? +oldO : 0);
      const safeOldD = Math.max(0, Number.isFinite(+oldD) ? +oldD : 0);
      const isCashIn = String(type || '').toUpperCase() === 'CASH_IN';
      const expectedNewO = isCashIn ? (safeOldO + safeAmt) : Math.max(0, safeOldO - safeAmt);
      const expectedNewD = isCashIn ? Math.max(0, safeOldD - safeAmt) : (safeOldD + safeAmt);
      return { expectedNewO, expectedNewD };
    }

    function buildFeatureVector(record, origState, destState) {
      const amount = +record.amount || 0;
      const oldO = +record.oldbalanceOrg || 0;
      const newO = +record.newbalanceOrig || 0;
      const oldD = +record.oldbalanceDest || 0;
      const newD = +record.newbalanceDest || 0;
      const step = +record.step || 1;
      const type = String(record.type || '').toUpperCase();

      const amount_log1p = Math.log1p(Math.max(0, amount));
      const balance_orig_diff = oldO - newO;
      const balance_dest_diff = newD - oldD;

      const { expectedNewO, expectedNewD } = expectedBalances(type, oldO, oldD, amount);
      const orig_balance_error = Math.abs(expectedNewO - newO) > 0.05 ? 1 : 0;
      const dest_balance_error = Math.abs(expectedNewD - newD) > 0.05 ? 1 : 0;

      const orig_drained = (oldO > 0 && newO === 0) ? 1 : 0;
      const hour_of_day = step % 24;

      const type_TRANSFER = type === 'TRANSFER' ? 1 : 0;
      const type_CASH_OUT = type === 'CASH_OUT' ? 1 : 0;
      const type_PAYMENT = type === 'PAYMENT' ? 1 : 0;
      const type_DEBIT = type === 'DEBIT' ? 1 : 0;
      const type_CASH_IN = type === 'CASH_IN' ? 1 : 0;

      const oState = origState || { count: 0, total: 0, steps: [] };
      const orig_prior_count = oState.count || 0;
      const orig_prior_mean_amount = orig_prior_count > 0 ? (oState.total / orig_prior_count) : 0;
      const amount_vs_orig_mean = orig_prior_mean_amount > 0 ? (amount / orig_prior_mean_amount) : 1.0;

      const dState = destState || { count: 0, max: 0 };
      const dest_prior_count = dState.count || 0;
      const dest_prior_max_amount = dState.max || 0;
      const is_new_dest = dest_prior_count === 0 ? 1 : 0;

      const recent = (oState.steps || []).filter(s => s > step - 24);
      const orig_txn_last_24_steps = recent.length;

      const vec = [
        +amount_log1p.toFixed(4), +balance_orig_diff.toFixed(4), +balance_dest_diff.toFixed(4),
        orig_balance_error, dest_balance_error, orig_drained, hour_of_day,
        type_TRANSFER, type_CASH_OUT, type_PAYMENT, type_DEBIT, type_CASH_IN,
        orig_prior_count, +orig_prior_mean_amount.toFixed(4), +amount_vs_orig_mean.toFixed(4),
        dest_prior_count, +dest_prior_max_amount.toFixed(4), is_new_dest, orig_txn_last_24_steps
      ];

      for (let k = 0; k < FEATURE_NAMES.length; k++) {
        vec[FEATURE_NAMES[k]] = vec[k];
      }

      return vec;
    }

    function extractCausalFeatures(records) {
      const origHist = new Map();
      const destHist = new Map();
      const X = [], y = [], featRows = [];

      for (let i = 0; i < records.length; i++) {
        const r = records[i];
        const orig = String(r.nameOrig || '');
        const dest = String(r.nameDest || '');
        const amount = +r.amount || 0;
        const step = +r.step || 1;

        const oState = origHist.get(orig) || { count: 0, total: 0, steps: [] };
        const dState = destHist.get(dest) || { count: 0, max: 0 };

        const vec = buildFeatureVector(r, oState, dState);
        X.push(vec);
        y.push(+r.isFraud === 1 ? 1 : 0);

        const featObj = { ...r };
        for (let k = 0; k < FEATURE_NAMES.length; k++) {
          featObj[FEATURE_NAMES[k]] = vec[k];
        }
        featRows.push(featObj);

        // Update history strictly AFTER row i is evaluated
        origHist.set(orig, {
          count: oState.count + 1,
          total: oState.total + amount,
          steps: [...oState.steps.filter(s => s > step - 48), step]
        });
        destHist.set(dest, {
          count: dState.count + 1,
          max: Math.max(dState.max, amount)
        });
      }

      return { X, y, featRows };
    }

    // 4. Pure-JS LightGBM Tree Ensemble Scorer (Flattened Typed Arrays + Iterative Tree Walk)
    function flattenTree(treeRoot) {
      const nodes = [];
      function traverse(node) {
        const idx = nodes.length;
        nodes.push(node);
        if (node.leaf_value !== undefined) return idx;
        const l = traverse(node.left_child);
        const r = traverse(node.right_child);
        node._l = l; node._r = r;
        return idx;
      }
      traverse(treeRoot);
      const n = nodes.length;
      const isLeaf = new Uint8Array(n);
      const feat = new Int16Array(n);
      const th = new Float64Array(n);
      const defL = new Uint8Array(n);
      const missType = new Uint8Array(n);
      const left = new Int32Array(n);
      const right = new Int32Array(n);
      const val = new Float64Array(n);
      for (let i = 0; i < n; i++) {
        const nd = nodes[i];
        if (nd.leaf_value !== undefined) {
          isLeaf[i] = 1; val[i] = nd.leaf_value;
        } else {
          isLeaf[i] = 0; feat[i] = nd.split_feature; th[i] = nd.threshold;
          defL[i] = nd.default_left ? 1 : 0;
          missType[i] = (nd.missing_type === 'NaN') ? 1 : 0;
          left[i] = nd._l; right[i] = nd._r;
        }
      }
      return { isLeaf, feat, th, defL, missType, left, right, val };
    }

    function prepareModelTrees(modelBundle) {
      if (!modelBundle) return;
      const target = modelBundle.model || modelBundle;
      if (target.trees && !target._flatTrees) {
        target._flatTrees = target.trees.map(flattenTree);
      }
      if (modelBundle.model && modelBundle.model._flatTrees && !modelBundle._flatTrees) {
        modelBundle._flatTrees = modelBundle.model._flatTrees;
      }
      if (!modelBundle.model && target.trees) {
        modelBundle.model = {
          trees: target.trees,
          thresholds: target.thresholds,
          feature_names: target.feature_names,
          _flatTrees: target._flatTrees
        };
      }
      if (target.thresholds && !modelBundle.thresholds) {
        modelBundle.thresholds = target.thresholds;
      }
    }

    function scoreRow(model, featureVector) {
      const m = model.model || model;
      // Fallback logistic regression scorer if cloud LightGBM was unreachable
      if (m.weights && m.scaler) {
        let z = m.bias || 0;
        const d = m.weights.length;
        for (let j = 0; j < d; j++) {
          z += m.weights[j] * ((featureVector[j] - m.scaler.mean[j]) / m.scaler.std[j]);
        }
        return sigmoidJS(z);
      }

      // Flatten trees on demand if not already prepared
      if (!m._flatTrees && m.trees) {
        m._flatTrees = m.trees.map(flattenTree);
      }

      if (m._flatTrees && m._flatTrees.length) {
        const flatTrees = m._flatTrees;
        let raw = 0;
        for (let t = 0; t < flatTrees.length; t++) {
          const ft = flatTrees[t];
          let curr = 0;
          while (ft.isLeaf[curr] === 0) {
            let val = featureVector[ft.feat[curr]];
            if (val == null || isNaN(val)) {
              if (ft.missType && ft.missType[curr] === 1) {
                curr = ft.defL[curr] === 1 ? ft.left[curr] : ft.right[curr];
              } else {
                val = 0.0;
                curr = val <= ft.th[curr] ? ft.left[curr] : ft.right[curr];
              }
            } else if (val <= ft.th[curr]) {
              curr = ft.left[curr];
            } else {
              curr = ft.right[curr];
            }
          }
          raw += ft.val[curr];
        }
        return sigmoidJS(raw);
      }

      // Standard iterative walk over nested tree objects
      const trees = m.trees || [];
      let raw = 0;
      for (let t = 0; t < trees.length; t++) {
        let curr = trees[t];
        while (curr.leaf_value === undefined) {
          let val = featureVector[curr.split_feature];
          if (val == null || isNaN(val)) {
            if (curr.missing_type === 'NaN') {
              curr = (curr.default_left ?? true) ? curr.left_child : curr.right_child;
            } else {
              val = 0.0;
              curr = val <= curr.threshold ? curr.left_child : curr.right_child;
            }
          } else if (val <= curr.threshold) {
            curr = curr.left_child;
          } else {
            curr = curr.right_child;
          }
        }
        raw += curr.leaf_value;
      }
      return sigmoidJS(raw);
    }

    // In-Browser Logistic Regression Fallback Trainer (Active ONLY when cloud LightGBM is unreachable)
    function fitScalerJS(X) {
      const n = X.length, d = X[0].length;
      const mean = new Array(d).fill(0);
      for (let i = 0; i < n; i++)for (let j = 0; j < d; j++)mean[j] += X[i][j];
      for (let j = 0; j < d; j++)mean[j] /= n;
      const std = new Array(d).fill(0);
      for (let i = 0; i < n; i++)for (let j = 0; j < d; j++) { const diff = X[i][j] - mean[j]; std[j] += diff * diff; }
      for (let j = 0; j < d; j++) { std[j] = Math.sqrt(std[j] / n); if (std[j] < 1e-8) std[j] = 1.0; }
      return { mean, std };
    }

    function scaleMatrixJS(X, scaler) {
      const n = X.length, d = scaler.mean.length;
      const out = new Array(n);
      for (let i = 0; i < n; i++) {
        const row = new Array(d);
        for (let j = 0; j < d; j++)row[j] = (X[i][j] - scaler.mean[j]) / scaler.std[j];
        out[i] = row;
      }
      return out;
    }

    function sigmoidJS(z) {
      if (z < -40) return 0; if (z > 40) return 1;
      return 1 / (1 + Math.exp(-z));
    }

    function trainLogisticJS(X, y, epochs = 15, lr = 0.015, l2 = 1e-4) {
      const n = X.length, d = X[0].length;
      const pos = y.reduce((a, b) => a + b, 0), neg = n - pos;
      const w_pos = n / (2 * Math.max(1, pos)), w_neg = n / (2 * Math.max(1, neg));
      const w = new Array(d).fill(0), m_w = new Array(d).fill(0), v_w = new Array(d).fill(0);
      let b = 0, m_b = 0, v_b = 0, t_step = 0;
      const beta1 = 0.9, beta2 = 0.999, eps = 1e-8, batchSize = 256;
      const indices = [...Array(n).keys()];

      for (let ep = 0; ep < epochs; ep++) {
        // In-place shuffle
        for (let i = n - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [indices[i], indices[j]] = [indices[j], indices[i]];
        }
        for (let start = 0; start < n; start += batchSize) {
          const end = Math.min(n, start + batchSize);
          const grad_w = new Array(d).fill(0);
          let grad_b = 0, batchWeight = 0;
          for (let idx = start; idx < end; idx++) {
            const i = indices[idx], sw = y[i] === 1 ? w_pos : w_neg;
            batchWeight += sw;
            let z = b; for (let j = 0; j < d; j++)z += w[j] * X[i][j];
            const p = sigmoidJS(z), err = sw * (p - y[i]);
            grad_b += err;
            for (let j = 0; j < d; j++)grad_w[j] += err * X[i][j];
          }
          t_step++;
          const inv = 1 / Math.max(1e-8, batchWeight);
          const gb = grad_b * inv;
          m_b = beta1 * m_b + (1 - beta1) * gb; v_b = beta2 * v_b + (1 - beta2) * (gb * gb);
          b -= lr * (m_b / (1 - Math.pow(beta1, t_step))) / (Math.sqrt(v_b / (1 - Math.pow(beta2, t_step))) + eps);
          for (let j = 0; j < d; j++) {
            const gw = grad_w[j] * inv + l2 * w[j];
            m_w[j] = beta1 * m_w[j] + (1 - beta1) * gw; v_w[j] = beta2 * v_w[j] + (1 - beta2) * (gw * gw);
            w[j] -= lr * (m_w[j] / (1 - Math.pow(beta1, t_step))) / (Math.sqrt(v_w[j] / (1 - Math.pow(beta2, t_step))) + eps);
          }
        }
      }
      return { weights: w, bias: b };
    }

    function computeRocAucJS(y, scores) {
      const n = y.length, pos = y.reduce((a, b) => a + b, 0), neg = n - pos;
      if (pos === 0 || neg === 0) return 0.5;
      const paired = scores.map((s, i) => ({ s, y: y[i] })).sort((a, b) => a.s - b.s);
      let rankSum = 0, i = 0;
      while (i < n) {
        let j = i;
        while (j < n - 1 && paired[j + 1].s === paired[j].s) j++;
        const avgRank = (i + 1 + j + 1) / 2;
        for (let k = i; k <= j; k++)if (paired[k].y === 1) rankSum += avgRank;
        i = j + 1;
      }
      return (rankSum - (pos * (pos + 1)) / 2) / (pos * neg);
    }

    function computePrAucJS(y, scores) {
      const n = y.length, pos = y.reduce((a, b) => a + b, 0);
      if (pos === 0) return 0;
      const paired = scores.map((s, i) => ({ s, y: y[i] })).sort((a, b) => b.s - a.s);
      let tp = 0, fp = 0, prevRec = 0, ap = 0, i = 0;
      while (i < n) {
        let j = i;
        while (j < n - 1 && paired[j + 1].s === paired[j].s) j++;
        for (let k = i; k <= j; k++)if (paired[k].y === 1) tp++; else fp++;
        const prec = tp / (tp + fp), rec = tp / pos;
        ap += (rec - prevRec) * prec;
        prevRec = rec;
        i = j + 1;
      }
      return ap;
    }

    function trainFallbackClientModel(X_train, y_train, X_test, y_test) {
      const t0 = performance.now();
      const scaler = fitScalerJS(X_train);
      const X_tr_s = scaleMatrixJS(X_train, scaler);
      const X_te_s = scaleMatrixJS(X_test, scaler);

      const valCut = Math.floor(X_tr_s.length * 0.8);
      const subX = X_tr_s.slice(0, valCut), subY = y_train.slice(0, valCut);
      const valX = X_tr_s.slice(valCut), valY = y_train.slice(valCut);

      const { weights, bias } = trainLogisticJS(subX, subY);
      const d = weights.length;

      const valScores = valX.map(row => { let z = bias; for (let j = 0; j < d; j++)z += weights[j] * row[j]; return sigmoidJS(z); });

      // F1 grid search for threshold
      let bestF1 = -1, decTh = 0.5;
      for (let th = 0.10; th <= 0.90; th += 0.02) {
        let tp = 0, fp = 0, fn = 0;
        for (let i = 0; i < valY.length; i++) {
          const p = valScores[i] >= th ? 1 : 0;
          if (p && valY[i]) tp++; else if (p && !valY[i]) fp++; else if (!p && valY[i]) fn++;
        }
        const prec = tp / Math.max(1, tp + fp), rec = tp / Math.max(1, tp + fn);
        const f1 = prec + rec > 0 ? 2 * prec * rec / (prec + rec) : 0;
        if (f1 > bestF1) { bestF1 = f1; decTh = th; }
      }

      const reviewTh = Math.min(decTh, 0.40);
      const blockTh = Math.max(decTh, 0.75);

      const testScores = X_te_s.map(row => { let z = bias; for (let j = 0; j < d; j++)z += weights[j] * row[j]; return sigmoidJS(z); });
      let tp = 0, fp = 0, fn = 0, tn = 0;
      for (let i = 0; i < y_test.length; i++) {
        const p = testScores[i] >= decTh ? 1 : 0;
        if (p && y_test[i]) tp++; else if (p && !y_test[i]) fp++; else if (!p && y_test[i]) fn++; else tn++;
      }
      const precision = tp / Math.max(1, tp + fp), recall = tp / Math.max(1, tp + fn), accuracy = (tp + tn) / y_test.length;
      const f1 = precision + recall > 0 ? 2 * precision * recall / (precision + recall) : 0;
      const rocAuc = computeRocAucJS(y_test, testScores);
      const prAuc = computePrAucJS(y_test, testScores);

      const importance = FEATURE_NAMES.map((name, j) => ({ feature: name, weight: +weights[j].toFixed(4) })).sort((a, b) => Math.abs(b.weight) - Math.abs(a.weight)).slice(0, 10);
      const t1 = performance.now();

      return {
        status: 'SUCCESS',
        model_version: 'fallback-browser-' + Date.now(),
        model: { weights, bias, scaler, feature_names: FEATURE_NAMES, thresholds: { decision: +decTh.toFixed(2), review: +reviewTh.toFixed(2), block: +blockTh.toFixed(2) } },
        metrics: { precision: +precision.toFixed(4), recall: +recall.toFixed(4), accuracy: +accuracy.toFixed(4), f1: +f1.toFixed(4), roc_auc: +rocAuc.toFixed(4), pr_auc: +prAuc.toFixed(4) },
        confusion: { tp, fp, fn, tn },
        baseline: { precision: 0, recall: 0, f1: 0, accuracy: +((y_test.length - y_test.reduce((a, b) => a + b, 0)) / y_test.length).toFixed(4) },
        importance,
        timings: { train_ms: +(t1 - t0).toFixed(2), total_ms: +(t1 - t0).toFixed(2) }
      };
    }

    async function trainModelStage() {
      const trainRecords = state.train;
      const testRecords = state.test;
      if (!trainRecords || !testRecords) throw new Error('Run Stage 5 partitioning first.');

      const { X: X_tr_full, y: y_tr_full } = extractCausalFeatures(trainRecords);
      const { X: X_te, y: y_te } = extractCausalFeatures(testRecords);

      function buildTrainPayload(trainX, trainY) {
        return {
          feature_names: FEATURE_NAMES,
          train: { X: trainX, y: trainY },
          test: { X: X_te, y: y_te },
          options: { num_boost_round: 300, learning_rate: 0.05, num_leaves: 15, max_depth: 6, min_data_in_leaf: 50, seed: 42 },
          meta: { split: `${state.trainPct}/${state.testPct}`, n_raw: state.raw.length, n_clean: state.clean?.length || 0 }
        };
      }

      let X_tr = X_tr_full, y_tr = y_tr_full;
      let requestPayload = buildTrainPayload(X_tr, y_tr);
      let payloadBodyStr = JSON.stringify(requestPayload);

      // AWS limits are 10 MB for API Gateway HTTP APIs and 6 MB for synchronous Lambda.
      // Send full chronological train partition at natural fraud rate when JSON.stringify <= 5,000,000 characters.
      if (payloadBodyStr.length <= 5000000) {
        state.undersampleNotice = null;
      } else {
        // If larger, undersample legitimate rows ONLY inside the first 80% of train rows (the fit slice).
        // Never touch the last 20% (validation), and keep chronological order.
        const n_train_total = X_tr_full.length;
        const fitSplit = Math.floor(n_train_total * 0.80);

        const X_val = X_tr_full.slice(fitSplit);
        const y_val = y_tr_full.slice(fitSplit);

        const fitFraudIdx = [];
        const fitLegitIdx = [];
        for (let i = 0; i < fitSplit; i++) {
          if (y_tr_full[i] === 1) fitFraudIdx.push(i);
          else fitLegitIdx.push(i);
        }

        const minX = fitFraudIdx.map(idx => X_tr_full[idx]).concat(X_val);
        const minY = fitFraudIdx.map(idx => y_tr_full[idx]).concat(y_val);
        const zeroLen = JSON.stringify(buildTrainPayload(minX, minY)).length;

        const charsForFitLegit = payloadBodyStr.length - zeroLen;
        const avgCharsPerLegit = charsForFitLegit / Math.max(1, fitLegitIdx.length);

        let allowedLegit = Math.max(0, Math.floor((4950000 - zeroLen) / avgCharsPerLegit));
        allowedLegit = Math.min(allowedLegit, fitLegitIdx.length);

        const sampleFit = (k) => {
          const step = fitLegitIdx.length / k;
          const chosenLegit = [];
          for (let j = 0; j < k; j++) {
            chosenLegit.push(fitLegitIdx[Math.floor(j * step)]);
          }
          const allFitChosen = [...fitFraudIdx, ...chosenLegit].sort((a, b) => a - b);
          const subX = allFitChosen.map(idx => X_tr_full[idx]).concat(X_val);
          const subY = allFitChosen.map(idx => y_tr_full[idx]).concat(y_val);
          return { subX, subY };
        };

        let sampled = sampleFit(allowedLegit);
        requestPayload = buildTrainPayload(sampled.subX, sampled.subY);
        payloadBodyStr = JSON.stringify(requestPayload);

        while (payloadBodyStr.length > 5000000 && allowedLegit > 100) {
          allowedLegit -= 200;
          sampled = sampleFit(allowedLegit);
          requestPayload = buildTrainPayload(sampled.subX, sampled.subY);
          payloadBodyStr = JSON.stringify(requestPayload);
        }

        X_tr = sampled.subX;
        y_tr = sampled.subY;

        state.undersampleNotice = `Train partition fit slice (first 80%) majority-class undersampled for transmission: kept ${fmt(allowedLegit)} of ${fmt(fitLegitIdx.length)} legitimate fit rows (${fmt(fitFraudIdx.length)} fit frauds preserved); validation slice (last 20%, ${fmt(X_val.length)} rows) and test partition (${fmt(X_te.length)} rows) kept 100% untouched. Total train rows: ${fmt(X_tr.length)}.`;
      }

      // Retrieve optional Training key from input or sessionStorage
      let trainKey = '';
      const inputEl = typeof document !== 'undefined' ? document.getElementById('trainApiKeyInput') : null;
      if (inputEl && inputEl.value !== undefined) {
        trainKey = inputEl.value.trim();
        if (typeof sessionStorage !== 'undefined') {
          if (trainKey) sessionStorage.setItem('TRAIN_API_KEY', trainKey);
          else sessionStorage.removeItem('TRAIN_API_KEY');
        }
      } else if (typeof sessionStorage !== 'undefined') {
        trainKey = (sessionStorage.getItem('TRAIN_API_KEY') || '').trim();
      }

      let modelResult = null;
      let modelSource = '';
      const apiBase = (API_BASE && API_BASE !== 'https://your-api-id.execute-api.ap-southeast-2.amazonaws.com') ? API_BASE.replace(/\/+$/, '') : '';

      if (apiBase) {
        if (trainKey) {
          // Training key entered: call POST /train with x-api-key header
          try {
            const trainUrl = apiBase + '/train';
            const headers = {
              "Content-Type": "application/json",
              "x-api-key": trainKey
            };

            const resp = await fetch(trainUrl, {
              method: 'POST',
              headers,
              body: payloadBodyStr
            });
            if (!resp.ok) {
              const errBody = await resp.json().catch(() => ({}));
              throw new Error(errBody.error || `HTTP ${resp.status} ${resp.statusText}`);
            }
            const data = await resp.json();
            if (data.status === 'SUCCESS' && (data.model || data.trees)) {
              modelResult = data;
              modelSource = 'Trained in AWS Lambda';
            } else {
              throw new Error(data.error || 'Invalid response format from cloud');
            }
          } catch (cloudErr) {
            console.warn('AWS Lambda train error:', cloudErr);
            state.backendError = cloudErr.message || String(cloudErr);
          }
        } else {
          // No key entered: call GET /model
          try {
            const modelUrl = apiBase + '/model';
            const resp = await fetch(modelUrl, { method: 'GET' });
            if (resp.ok) {
              const data = await resp.json();
              if (data && (data.trees || data.model?.trees || data.weights)) {
                modelResult = data;
                modelSource = 'Loaded pre-trained model from AWS (GET /model)';
              } else {
                console.warn('GET /model returned empty or invalid bundle:', data);
              }
            } else {
              console.warn(`GET /model returned HTTP ${resp.status}`);
            }
          } catch (getErr) {
            console.warn('AWS Lambda GET /model error:', getErr);
            state.backendError = getErr.message || String(getErr);
          }
        }
      } else {
        state.backendError = 'Placeholder API endpoint';
      }

      // If no model exists, fall back to the local logistic regression as today
      if (!modelResult) {
        modelResult = trainFallbackClientModel(X_tr, y_tr, X_te, y_te);
        modelSource = 'Fallback: logistic regression (cloud model unavailable)';
      }

      state.model = modelResult;
      prepareModelTrees(state.model);
      state.modelSource = modelSource;
      return modelResult;
    }

    function buildRealTrainPayload() {
      if (!state.realSplits || !state.realData || !state.realClean) {
        throw new Error('Run Stage 5 partitioning first.');
      }
      const d = state.realClean.featureCols.length;
      const featureCols = state.realClean.featureCols;
      const validIndices = state.realClean.validIndices;
      const labelArr = state.realData.rawColumns.get(state.realData.labelCol);
      const featColsData = featureCols.map(c => state.realData.rawColumns.get(c));

      function round6Sig(v) {
        if (v == null || isNaN(v)) return null;
        return Number(Number(v).toPrecision(6));
      }

      function extractVector(cleanIdx) {
        const origIdx = validIndices[cleanIdx];
        const row = new Array(d);
        for (let j = 0; j < d; j++) {
          row[j] = round6Sig(featColsData[j][origIdx]);
        }
        return row;
      }

      // 1. Fit slice: keep all positives, undersample negatives to 1:1 (seeded mulberry32(42))
      const fitIndices = state.realSplits.fit;
      const fitPos = [];
      const fitNeg = [];
      for (let i = 0; i < fitIndices.length; i++) {
        const origIdx = validIndices[fitIndices[i]];
        if (labelArr[origIdx] === 1) fitPos.push(fitIndices[i]);
        else fitNeg.push(fitIndices[i]);
      }

      let chosenFitNeg;
      if (fitNeg.length <= fitPos.length || fitPos.length === 0) {
        chosenFitNeg = fitNeg.slice();
      } else {
        const rand = mulberry32(42);
        const shuffled = fitNeg.slice();
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(rand() * (i + 1));
          const tmp = shuffled[i]; shuffled[i] = shuffled[j]; shuffled[j] = tmp;
        }
        chosenFitNeg = shuffled.slice(0, fitPos.length);
      }
      const chosenFit = [...fitPos, ...chosenFitNeg].sort((a, b) => a - b);

      const fitX = new Array(chosenFit.length);
      const fitY = new Array(chosenFit.length);
      for (let i = 0; i < chosenFit.length; i++) {
        fitX[i] = extractVector(chosenFit[i]);
        fitY[i] = labelArr[validIndices[chosenFit[i]]];
      }

      // 2. Validation slice: natural prevalence, uniformly subsampled if payload exceeds 4.5 MB budget
      const valIndices = Array.from(state.realSplits.val);
      const valPos = [];
      const valNeg = [];
      for (let i = 0; i < valIndices.length; i++) {
        const origIdx = validIndices[valIndices[i]];
        if (labelArr[origIdx] === 1) valPos.push(valIndices[i]);
        else valNeg.push(valIndices[i]);
      }

      function assemble(fX, fY, vIdxs) {
        const vX = new Array(vIdxs.length);
        const vY = new Array(vIdxs.length);
        for (let i = 0; i < vIdxs.length; i++) {
          vX[i] = extractVector(vIdxs[i]);
          vY[i] = labelArr[validIndices[vIdxs[i]]];
        }
        return {
          feature_names: featureCols,
          train: {
            X: fX.concat(vX),
            y: fY.concat(vY)
          },
          options: {
            fit_rows: fX.length,
            num_boost_round: 300,
            learning_rate: 0.05,
            num_leaves: 15,
            max_depth: 6,
            min_data_in_leaf: 50,
            seed: 42
          },
          meta: {
            dataset_mode: 'real',
            fit_rows: fX.length,
            val_rows: vIdxs.length
          }
        };
      }

      const fitOnlyPayload = assemble(fitX, fitY, []);
      const fitOnlyLen = JSON.stringify(fitOnlyPayload).length;
      if (fitOnlyLen > 4500000) {
        throw new Error(`Fit slice alone (${(fitOnlyLen / 1048576).toFixed(2)} MB) exceeds 4.5 MB budget. Dataset cannot fit within API limits.`);
      }

      let chosenVal = valIndices;
      let fullPayload = assemble(fitX, fitY, chosenVal);
      let payloadStr = JSON.stringify(fullPayload);

      let valSubsampled = false;
      const budgetChars = 4450000;

      if (payloadStr.length > budgetChars) {
        valSubsampled = true;
        const charsForVal = payloadStr.length - fitOnlyLen;
        const avgCharsPerValRow = Math.max(1, charsForVal / valIndices.length);
        let allowedValRows = Math.max(0, Math.floor((budgetChars - fitOnlyLen) / avgCharsPerValRow));
        allowedValRows = Math.min(allowedValRows, valIndices.length);

        if (allowedValRows < 20 && valIndices.length >= 20) {
          throw new Error('Validation slice cannot fit within 4.5 MB transmission budget.');
        }

        const prev = valIndices.length ? (valPos.length / valIndices.length) : 0;
        let targetPos = Math.max(valPos.length > 0 ? 1 : 0, Math.min(valPos.length, Math.floor(allowedValRows * prev)));
        let targetNeg = Math.min(valNeg.length, allowedValRows - targetPos);

        function sampleSeeded(arr, k, seed) {
          if (arr.length <= k) return arr.slice();
          const rand = mulberry32(seed);
          const copy = arr.slice();
          for (let i = copy.length - 1; i > 0; i--) {
            const j = Math.floor(rand() * (i + 1));
            const tmp = copy[i]; copy[i] = copy[j]; copy[j] = tmp;
          }
          return copy.slice(0, k).sort((a, b) => a - b);
        }

        const subValPos = sampleSeeded(valPos, targetPos, 42);
        const subValNeg = sampleSeeded(valNeg, targetNeg, 43);
        chosenVal = [...subValPos, ...subValNeg].sort((a, b) => a - b);
        fullPayload = assemble(fitX, fitY, chosenVal);
        payloadStr = JSON.stringify(fullPayload);

        while (payloadStr.length > budgetChars && targetNeg > 50) {
          targetNeg = Math.max(10, targetNeg - 100);
          const subNeg = sampleSeeded(valNeg, targetNeg, 43);
          chosenVal = [...subValPos, ...subNeg].sort((a, b) => a - b);
          fullPayload = assemble(fitX, fitY, chosenVal);
          payloadStr = JSON.stringify(fullPayload);
        }
      }

      if (payloadStr.length > 4718592) {
        throw new Error(`Serialized JSON (${(payloadStr.length / 1048576).toFixed(2)} MB) exceeds 4.5 MB limit.`);
      }

      state.realPayloadInfo = {
        fitRows: fitX.length,
        fitPos: fitPos.length,
        fitNeg: chosenFitNeg.length,
        valRows: chosenVal.length,
        valTotal: valIndices.length,
        valSubsampled,
        testRows: state.realSplits.test.length,
        payloadBytes: payloadStr.length,
        payloadMB: (payloadStr.length / 1048576).toFixed(2)
      };

      return { payload: fullPayload, payloadStr };
    }

    async function trainModelStageReal() {
      const { payload, payloadStr } = buildRealTrainPayload();

      // Retrieve optional Training key from input or sessionStorage
      let trainKey = '';
      const inputEl = typeof document !== 'undefined' ? document.getElementById('trainApiKeyInput') : null;
      if (inputEl && inputEl.value !== undefined) {
        trainKey = inputEl.value.trim();
        if (typeof sessionStorage !== 'undefined') {
          if (trainKey) sessionStorage.setItem('TRAIN_API_KEY', trainKey);
          else sessionStorage.removeItem('TRAIN_API_KEY');
        }
      } else if (typeof sessionStorage !== 'undefined') {
        trainKey = (sessionStorage.getItem('TRAIN_API_KEY') || '').trim();
      }

      const apiBase = (API_BASE && API_BASE !== 'https://your-api-id.execute-api.ap-southeast-2.amazonaws.com') ? API_BASE.replace(/\/+$/, '') : '';
      if (!apiBase) {
        throw new Error('Configure API_BASE in frontend/config.js to train with AWS Lambda.');
      }
      if (!trainKey) {
        throw new Error('Please enter your Training API Key (x-api-key) to train the model.');
      }

      const trainUrl = apiBase + '/train';
      const headers = {
        "Content-Type": "application/json",
        "x-api-key": trainKey
      };

      const resp = await fetch(trainUrl, {
        method: 'POST',
        headers,
        body: payloadStr
      });

      if (!resp.ok) {
        const errBody = await resp.json().catch(() => ({}));
        throw new Error(errBody.error || `HTTP ${resp.status} ${resp.statusText}`);
      }

      const data = await resp.json();
      if (data.status !== 'SUCCESS' || (!data.model && !data.trees)) {
        throw new Error(data.error || 'Invalid response format from AWS Lambda');
      }

      state.model = data.model || data;
      if (data.thresholds && !state.model.thresholds) state.model.thresholds = data.thresholds;
      prepareModelTrees(state.model);
      state.modelSource = 'Trained in AWS Lambda (Real Dataset)';

      // Score FULL test slice in the browser in pure JS
      const d = state.realClean.featureCols.length;
      const validIndices = state.realClean.validIndices;
      const labelArr = state.realData.rawColumns.get(state.realData.labelCol);
      const featColsData = state.realClean.featureCols.map(c => state.realData.rawColumns.get(c));
      const testIndices = state.realSplits.test;

      const testScores = new Float64Array(testIndices.length);
      const testLabels = new Int32Array(testIndices.length);

      for (let i = 0; i < testIndices.length; i++) {
        const cleanIdx = testIndices[i];
        const origIdx = validIndices[cleanIdx];
        const row = new Array(d);
        for (let j = 0; j < d; j++) {
          row[j] = featColsData[j][origIdx];
        }
        testScores[i] = scoreRow(state.model, row);
        testLabels[i] = labelArr[origIdx];
      }

      const prAuc = computePrAucJS(Array.from(testLabels), Array.from(testScores));
      const rocAuc = computeRocAucJS(Array.from(testLabels), Array.from(testScores));
      const decTh = state.model.thresholds?.decision ?? 0.50;

      let tp = 0, fp = 0, fn = 0, tn = 0;
      for (let i = 0; i < testLabels.length; i++) {
        const pred = testScores[i] >= decTh ? 1 : 0;
        const actual = testLabels[i];
        if (pred === 1 && actual === 1) tp++;
        else if (pred === 1 && actual === 0) fp++;
        else if (pred === 0 && actual === 1) fn++;
        else tn++;
      }

      const precision = tp / Math.max(1, tp + fp);
      const recall = tp / Math.max(1, tp + fn);
      const accuracy = (tp + tn) / Math.max(1, testLabels.length);
      const f1 = (precision + recall > 0) ? (2 * precision * recall) / (precision + recall) : 0;

      state.realMetrics = {
        pr_auc: prAuc,
        roc_auc: rocAuc,
        precision,
        recall,
        accuracy,
        f1,
        confusion: { tp, fp, fn, tn },
        testScores,
        testLabels
      };

      return state.model;
    }

    function execute(i) {
      if (state.datasetMode === 'real') {
        return executeReal(i);
      }
      if (i === 0) {
        if (!state.raw.length) state.raw = state.baseRaw.map(r => ({ ...r }));
        resetDownstream();
      }
      if (i === 1) {
        // Stage 2: Integrity & Balance Continuity Validation
        const seen = new Set(), out = [];
        let nullCount = 0, negCount = 0, dupCount = 0, balanceErrors = 0;

        for (const z of state.raw) {
          let hasNull = false, hasNeg = false;
          ['step', 'type', 'amount', 'nameOrig', 'oldbalanceOrg', 'newbalanceOrig', 'nameDest', 'oldbalanceDest', 'newbalanceDest', 'isFraud'].forEach(k => {
            if (z[k] == null || z[k] === '') hasNull = true;
          });
          if (hasNull) nullCount++;

          const amt = +z.amount || 0;
          if (amt < 0 || +z.oldbalanceOrg < 0 || +z.newbalanceOrig < 0 || +z.oldbalanceDest < 0 || +z.newbalanceDest < 0) {
            negCount++;
            hasNeg = true;
          }

          const safeAmt = Math.abs(amt);
          const oldO = Math.max(0, Number.isFinite(+z.oldbalanceOrg) ? +z.oldbalanceOrg : 0);
          const newO = Math.max(0, Number.isFinite(+z.newbalanceOrig) ? +z.newbalanceOrig : 0);
          const oldD = Math.max(0, Number.isFinite(+z.oldbalanceDest) ? +z.oldbalanceDest : 0);
          const newD = Math.max(0, Number.isFinite(+z.newbalanceDest) ? +z.newbalanceDest : 0);

          const { expectedNewO, expectedNewD } = expectedBalances(z.type, oldO, oldD, safeAmt);
          const origErr = Math.abs(expectedNewO - newO) > 0.05;
          const destErr = Math.abs(expectedNewD - newD) > 0.05;
          if (origErr || destErr) balanceErrors++;

          const key = [z.step, z.type, z.nameOrig, z.nameDest, safeAmt].join('|');
          if (seen.has(key)) { dupCount++; continue; }
          seen.add(key);

          out.push({
            step: +z.step || 1,
            type: z.type || 'PAYMENT',
            amount: safeAmt,
            nameOrig: z.nameOrig || 'C0',
            oldbalanceOrg: oldO,
            newbalanceOrig: newO,
            nameDest: z.nameDest || 'M0',
            oldbalanceDest: oldD,
            newbalanceDest: newD,
            isFraud: +z.isFraud === 1 ? 1 : 0
          });
        }
        state.audit = { nullCount, negCount, dupCount, balanceErrors };
        state.clean = out;
      }
      if (i === 2 && !state.clean) throw Error('Run Stage 2 first.');
      if (i === 3) {
        // Stage 4: Strictly Causal Feature Engineering
        const src = state.clean || state.raw;
        // Guarantee chronological ordering
        src.sort((a, b) => a.step - b.step);
        const { featRows } = extractCausalFeatures(src);
        state.feat = featRows;
      }
      if (i === 4) {
        // Stage 5: Chronological Partitioning
        const src = state.feat || state.clean || state.raw;
        src.sort((a, b) => a.step - b.step);
        const trainPct = state.auto ? 70 : (state.trainPct ?? 70);
        const testPct = state.auto ? 30 : (state.testPct ?? 30);
        if (trainPct + testPct !== 100) throw Error('Training and testing percentages must total 100%.');
        state.trainPct = trainPct; state.testPct = testPct;
        const p = Math.floor(src.length * (trainPct / 100));
        state.train = src.slice(0, p);
        state.test = src.slice(p);
      }
      if (i === 5) {
        // Stage 6 is handled asynchronously via trainModelStage()
      }
      if (i === 6) {
        // Stage 7: Operational Scoring with Trained Model
        if (!state.model) throw Error('Train a model in Stage 6 first.');
        prepareModelTrees(state.model);
        const src = state.feat || state.clean || state.raw;
        const th = state.model.model?.thresholds || state.model.thresholds || { decision: 0.50, review: 0.40, block: 0.75 };
        const { X } = extractCausalFeatures(src);
        const trainCutoff = state.train ? state.train.length : Math.floor(src.length * ((state.trainPct ?? 70) / 100));

        state.score = src.map((r, idx) => {
          const s = +scoreRow(state.model, X[idx]).toFixed(4);
          const action = s >= th.block ? 'Block' : s >= th.review ? 'Review' : 'Approve';
          const split = idx < trainCutoff ? 'train' : 'test';
          return { ...r, fraud_score: s, audit_action: action, split, _seq: idx + 1 };
        });
        startLive();
      }
    }

    async function scoreStage7() {
      if (!state.model) throw Error('Train a model in Stage 6 first.');
      prepareModelTrees(state.model);
      const src = state.feat || state.clean || state.raw;
      const th = state.model.model?.thresholds || state.model.thresholds || { decision: 0.50, review: 0.40, block: 0.75 };
      const { X } = extractCausalFeatures(src);
      const total = src.length;
      const scores = new Array(total);
      const CHUNK_SIZE = 10000;
      const trainCutoff = state.train ? state.train.length : Math.floor(src.length * ((state.trainPct ?? 70) / 100));

      for (let start = 0; start < total; start += CHUNK_SIZE) {
        const end = Math.min(total, start + CHUNK_SIZE);
        for (let idx = start; idx < end; idx++) {
          const s = +scoreRow(state.model, X[idx]).toFixed(4);
          const action = s >= th.block ? 'Block' : s >= th.review ? 'Review' : 'Approve';
          const split = idx < trainCutoff ? 'train' : 'test';
          scores[idx] = { ...src[idx], fraud_score: s, audit_action: action, split, _seq: idx + 1 };
        }
        if (end < total) {
          await new Promise(resolve => setTimeout(resolve, 0));
        }
      }
      state.score = scores;
      startLive();
      return scores;
    }

    function runManualStage(i) {
      if (state.running) return;
      state.auto = false;
      showTimedProgress(`Stage ${i + 1} executing`, EXEC_MS, async () => {
        try {
          if (state.datasetMode === 'real') {
            if (i === 5) {
              await trainModelStageReal();
            } else if (i === 6) {
              execute(6);
            } else {
              execute(i);
            }
          } else {
            if (i === 5) {
              await trainModelStage();
            } else if (i === 6) {
              await scoreStage7();
            } else {
              execute(i);
            }
          }
          state.executedStages[i] = true;
          state.running = false;
          state.stage = i;
          setStatus(`Stage ${i + 1} executed ✓`);
          render(i);
        } catch (e) {
          state.running = false;
          setStatus('Stage failed', 'err');
          render(i);
          $('app').insertAdjacentHTML('afterbegin', `<div class="notice error">${esc(e.message || e)}</div>`);
        }
      });
    }

    function runAutomaticStage(i) {
      if (!state.auto || state.running) return;
      if (i === 4) { state.trainPct = 70; state.testPct = 30; }
      state.stage = i;
      render(i);
      showTimedProgress(`Stage ${i + 1} executing`, EXEC_MS, async (token) => {
        if (token !== state.runToken || !state.auto) return;
        try {
          if (state.datasetMode === 'real') {
            if (i === 5) {
              await trainModelStageReal();
            } else if (i === 6) {
              execute(6);
            } else {
              execute(i);
            }
          } else {
            if (i === 5) {
              await trainModelStage();
            } else if (i === 6) {
              await scoreStage7();
            } else {
              execute(i);
            }
          }
          state.executedStages[i] = true;
          setStatus(`Stage ${i + 1} executed ✓`);
          state.stage = i;
          render(i);
          showObservationHold(i, token, () => {
            if (token !== state.runToken || !state.auto) return;
            if (state.datasetMode === 'real' && i >= 6) {
              state.auto = false;
              $('auto').checked = false;
              state.stage = 7;
              setStatus('Real mode pipeline complete through Stage 7 ✓');
              render(7);
              return;
            }
            if (i < 6) {
              state.stage = i + 1;
              render(i + 1);
              schedule(() => runAutomaticStage(i + 1), 50);
            } else {
              state.auto = false;
              $('auto').checked = false;
              state.stage = 7;
              setStatus('Pipeline complete');
              render(7);
            }
          });
        } catch (e) {
          state.running = false;
          setStatus('Stage failed', 'err');
          render(i);
          $('app').insertAdjacentHTML('afterbegin', `<div class="notice error">${esc(e.message || e)}</div>`);
        }
      });
    }

    function runStage(i, auto = false) {
      if (state.running) return;
      if (auto) runAutomaticStage(i);
      else runManualStage(i);
    }

    function donutBlock(items, totalLabel, selected, scope = 'dashboard') {
      const total = Math.max(1, items.reduce((a, x) => a + x.value, 0));
      const R = 72, C = 2 * Math.PI * R;
      let offset = 0;
      const segs = items.map(x => {
        const dash = (x.value / total) * C;
        const seg = `<circle class="visual-segment ${selected === x.key ? 'selected' : ''}" data-visual-pick="${esc(scope)}|${esc(x.key)}" cx="100" cy="100" r="${R}" fill="none" stroke="${x.color}" stroke-width="34" stroke-dasharray="${dash} ${Math.max(0, C - dash)}" stroke-dashoffset="${-offset}" transform="rotate(-90 100 100)"></circle>`;
        offset += dash; return seg;
      }).join('');

    function verticalBarChart(items, scope = 'dashboard', selected = null) {

    function computeRealReplay(scores, labels, validIndices, testIndices, rawColumns, featureCols, thresholds) {
      const N_test = scores ? scores.length : 0;
      const th = thresholds || { decision: 0.50, review: 0.40, block: 0.75 };
      const thRev = Number(th.review ?? 0.40);
      const thDec = Number(th.decision ?? 0.50);
      const thBlock = Number(th.block ?? 0.75);

      const counts = {
        Allow: { count: 0, frauds: 0, legit: 0 },
        Review: { count: 0, frauds: 0, legit: 0 },
        Block: { count: 0, frauds: 0, legit: 0 }
      };

      let totalFrauds = 0;
      let totalLegit = 0;

      for (let i = 0; i < N_test; i++) {
        const s = scores[i];
        const y = labels ? labels[i] : 0;
        if (y === 1) totalFrauds++;
        else totalLegit++;

        let action = 'Allow';
        if (s >= thBlock) action = 'Block';
        else if (s >= thRev) action = 'Review';

        counts[action].count++;
        if (y === 1) counts[action].frauds++;
        else counts[action].legit++;
      }

      const sortedIndices = new Int32Array(N_test);
      for (let i = 0; i < N_test; i++) sortedIndices[i] = i;
      sortedIndices.sort((a, b) => scores[b] - scores[a]);

      const f1Col = featureCols ? featureCols[0] : null;
      const f2Col = featureCols ? featureCols[1] : null;
      const f3Col = featureCols ? featureCols[2] : null;
      const f1Data = (f1Col && rawColumns) ? rawColumns.get(f1Col) : null;
      const f2Data = (f2Col && rawColumns) ? rawColumns.get(f2Col) : null;
      const f3Data = (f3Col && rawColumns) ? rawColumns.get(f3Col) : null;

      const top50 = [];
      const numTop = Math.min(50, N_test);
      for (let j = 0; j < numTop; j++) {
        const testIdx = sortedIndices[j];
        const s = scores[testIdx];
        const origIdx = (validIndices && testIndices) ? validIndices[testIndices[testIdx]] : testIdx;
        let action = 'Allow';
        if (s >= thBlock) action = 'Block';
        else if (s >= thRev) action = 'Review';

        top50.push({
          rank: j + 1,
          rowNumber: origIdx + 1,
          testIndex: testIdx + 1,
          score: s,
          action,
          label: labels ? labels[testIdx] : 0,
          f1: f1Data ? f1Data[origIdx] : null,
          f2: f2Data ? f2Data[origIdx] : null,
          f3: f3Data ? f3Data[origIdx] : null
        });
      }

      return {
        N_test,
        thRev,
        thDec,
        thBlock,
        isThresholdsEqual: thRev === thBlock,
        counts,
        totalFrauds,
        totalLegit,
        top50,
        sortedIndices
      };
    }

    function computeGainCurve(scores, labels) {
      const n = scores ? scores.length : 0;
      if (!n) return [{ x: 0, y: 0 }, { x: 1, y: 1 }];

      const indices = new Int32Array(n);
      for (let i = 0; i < n; i++) indices[i] = i;
      indices.sort((a, b) => scores[b] - scores[a]);

      let totalFrauds = 0;
      for (let i = 0; i < n; i++) {
        if (labels[i] === 1) totalFrauds++;
      }
      if (totalFrauds === 0) {
        return [{ x: 0, y: 0 }, { x: 1, y: 1 }];
      }

      const numSteps = Math.min(100, n);
      const points = [{ x: 0, y: 0 }];
      let cumFraud = 0;
      let nextStep = 1;

      for (let k = 1; k <= n; k++) {
        if (labels[indices[k - 1]] === 1) cumFraud++;
        const targetK = Math.round((nextStep / numSteps) * n);
        if (k === targetK || k === n) {
          points.push({
            x: +(k / n).toFixed(4),
            y: +(cumFraud / totalFrauds).toFixed(4)
          });
          nextStep++;
        }
      }

      const last = points[points.length - 1];
      if (last.x !== 1 || last.y !== 1) {
        points.push({ x: 1, y: 1 });
      }
      return points;
    }

    function renderClassScoreHistogram(scores, labels) {
      const BINS = 10;
      const binLegit = new Int32Array(BINS);
      const binFraud = new Int32Array(BINS);
      const N = scores ? scores.length : 0;
      for (let i = 0; i < N; i++) {
        const s = scores[i];
        let b = Math.floor(s * BINS);
        if (b >= BINS) b = BINS - 1;
        if (b < 0) b = 0;
        if (labels && labels[i] === 1) binFraud[b]++;
        else binLegit[b]++;
      }

      let maxBinTotal = 1;
      for (let b = 0; b < BINS; b++) {
        const total = binLegit[b] + binFraud[b];
        if (total > maxBinTotal) maxBinTotal = total;
      }

      const W = 360, H = 250, left = 45, right = 15, top = 25, bottom = 45;
      const plotW = W - left - right;
      const plotH = H - top - bottom;
      const slot = plotW / BINS;
      const barW = Math.max(8, slot * 0.75);

      let barsSvg = '';
      for (let b = 0; b < BINS; b++) {
        const xPos = left + b * slot + (slot - barW) / 2;
        const countL = binLegit[b];
        const countF = binFraud[b];
        const total = countL + countF;
        if (total === 0) continue;

        const totalH = Math.max(3, (total / maxBinTotal) * plotH);
        const yTop = top + plotH - totalH;
        const fraudH = total > 0 ? (countF / total) * totalH : 0;
        const legitH = totalH - fraudH;

        if (legitH > 0) {
          barsSvg += `<rect x="${xPos}" y="${top + plotH - legitH}" width="${barW}" height="${legitH}" fill="#4d8be8" rx="2"><title>Bin [${(b / 10).toFixed(1)}-${((b + 1) / 10).toFixed(1)}]: ${fmt(countL)} Legit</title></rect>`;
        }
        if (fraudH > 0) {
          barsSvg += `<rect x="${xPos}" y="${yTop}" width="${barW}" height="${Math.max(2, fraudH)}" fill="#ff647c" rx="2"><title>Bin [${(b / 10).toFixed(1)}-${((b + 1) / 10).toFixed(1)}]: ${fmt(countF)} Fraud</title></rect>`;
        }
      }

      let xTicks = '';
      for (let b = 0; b <= BINS; b += 2) {
        const x = left + b * slot;
        xTicks += `<text x="${x}" y="${H - 28}" fill="#9eabc7" font-size="10" text-anchor="middle">${(b / 10).toFixed(1)}</text>`;
      }

      return `<div style="display:flex;flex-direction:column;align-items:center">
        <svg class="visual-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Score histogram split by true class">
          <line x1="${left}" y1="${top + plotH}" x2="${W - right}" y2="${top + plotH}" stroke="#405172"></line>
          <line x1="${left}" y1="${top + plotH / 2}" x2="${W - right}" y2="${top + plotH / 2}" stroke="#27354f" stroke-dasharray="3 3"></line>
          <line x1="${left}" y1="${top}" x2="${W - right}" y2="${top}" stroke="#27354f" stroke-dasharray="3 3"></line>
          <text x="${left - 6}" y="${top + 4}" fill="#9eabc7" font-size="10" text-anchor="end">${fmt(maxBinTotal)}</text>
          <text x="${left - 6}" y="${top + plotH / 2 + 4}" fill="#9eabc7" font-size="10" text-anchor="end">${fmt(Math.round(maxBinTotal / 2))}</text>
          <text x="${left - 6}" y="${top + plotH + 4}" fill="#9eabc7" font-size="10" text-anchor="end">0</text>
          ${barsSvg}
          ${xTicks}
          <text x="${left + plotW / 2}" y="${H - 10}" fill="#9eabc7" font-size="10" text-anchor="middle">Predicted Fraud Score (Bins)</text>
        </svg>
        <div style="display:flex;gap:16px;margin-top:6px;font-size:11px">
          <span style="display:flex;align-items:center;gap:5px"><i style="width:10px;height:10px;background:#ff647c;border-radius:2px;display:inline-block"></i> Fraud (1)</span>
          <span style="display:flex;align-items:center;gap:5px"><i style="width:10px;height:10px;background:#4d8be8;border-radius:2px;display:inline-block"></i> Legitimate (0)</span>
        </div>
      </div>`;
    }

    function renderGainCurveSvg(points) {
      const W = 360, H = 250, left = 45, right = 20, top = 25, bottom = 45;
      const plotW = W - left - right;
      const plotH = H - top - bottom;

      const baseLine = `<line x1="${left}" y1="${top + plotH}" x2="${left + plotW}" y2="${top}" stroke="#475569" stroke-dasharray="4 4" stroke-width="1.5"></line>`;
      const dPath = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${(left + p.x * plotW).toFixed(1)} ${(top + (1 - p.y) * plotH).toFixed(1)}`).join(' ');
      const dArea = dPath + ` L ${left + plotW} ${top + plotH} L ${left} ${top + plotH} Z`;

      let yElements = '';
      [0, 0.25, 0.5, 0.75, 1.0].forEach(frac => {
        const y = top + (1 - frac) * plotH;
        yElements += `<line x1="${left}" y1="${y}" x2="${left + plotW}" y2="${y}" stroke="#27354f" stroke-dasharray="${frac === 0 ? '' : '3 3'}"></line>`;
        yElements += `<text x="${left - 6}" y="${y + 4}" fill="#9eabc7" font-size="10" text-anchor="end">${Math.round(frac * 100)}%</text>`;
      });

      let xElements = '';
      [0, 0.25, 0.5, 0.75, 1.0].forEach(frac => {
        const x = left + frac * plotW;
        xElements += `<text x="${x}" y="${H - 28}" fill="#9eabc7" font-size="10" text-anchor="middle">${Math.round(frac * 100)}%</text>`;
      });

      return `<div style="display:flex;flex-direction:column;align-items:center">
        <svg class="visual-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative gain curve">
          ${yElements}
          ${baseLine}
          <path d="${dArea}" fill="rgba(88, 166, 255, 0.12)"></path>
          <path d="${dPath}" fill="none" stroke="#58a6ff" stroke-width="2.5"></path>
          ${xElements}
          <text x="${left + plotW / 2}" y="${H - 10}" fill="#9eabc7" font-size="10" text-anchor="middle">Share of Test Rows Reviewed (%)</text>
        </svg>
        <div style="display:flex;gap:16px;margin-top:6px;font-size:11px">
          <span style="display:flex;align-items:center;gap:5px"><i style="width:14px;height:2px;background:#58a6ff;display:inline-block"></i> LightGBM Model</span>
          <span style="display:flex;align-items:center;gap:5px"><i style="width:14px;height:2px;border-top:2px dashed #475569;display:inline-block"></i> Random Selection</span>
        </div>
      </div>`;
    }

    function simulateRealStreamReplay(scores, labels, thresholds) {
      const N = scores ? scores.length : 0;
      const th = thresholds || { decision: 0.50, review: 0.40, block: 0.75 };
      const thRev = Number(th.review ?? 0.40);
      const thBlock = Number(th.block ?? 0.75);
      const counts = { replayed: 0, Allow: 0, Review: 0, Block: 0, fraudsCaught: 0 };
      const rows = [];
      for (let i = 0; i < N; i++) {
        const s = scores[i];
        const y = labels ? labels[i] : 0;
        let action = 'Allow';
        if (s >= thBlock) action = 'Block';
        else if (s >= thRev) action = 'Review';
        counts.replayed++;
        counts[action]++;
        if (action === 'Block' && y === 1) counts.fraudsCaught++;
        rows.push({ index: i, score: s, action, label: y });
      }
      return { counts, rows };
    }

    function showRealBlockToast(rowNum, score) {
      const container = typeof document !== 'undefined' ? document.getElementById('realToastContainer') : null;
      if (!container) return;

      const activeToasts = Array.from(container.querySelectorAll('.real-toast:not(.fade-out)'));

      function scheduleToastDismiss(el) {
        if (el._timer) clearTimeout(el._timer);
        el._timer = setTimeout(() => {
          el.classList.add('fade-out');
          const reducedMotion = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          const fadeDuration = reducedMotion ? 0 : 250;
          setTimeout(() => {
            if (el.parentNode) el.parentNode.removeChild(el);
          }, fadeDuration);
        }, 3000);
      }

      if (activeToasts.length < 3) {
        const toast = document.createElement('div');
        toast.className = 'real-toast';
        toast.innerHTML = `<div style="font-weight:700;color:#ff647c;margin-bottom:2px">⚠ Block Notification</div><div>Row #${rowNum} &bull; Score: <b>${score.toFixed(4)}</b></div>`;
        container.appendChild(toast);
        scheduleToastDismiss(toast);
      } else {
        const third = activeToasts[2];
        third._collapsedCount = (third._collapsedCount || 1) + 1;
        third.innerHTML = `<div style="font-weight:700;color:#ff647c;margin-bottom:2px">⚠ Block Notification</div><div>+${third._collapsedCount} more blocked</div>`;
        scheduleToastDismiss(third);
        for (let k = 3; k < activeToasts.length; k++) {
          if (activeToasts[k]._timer) clearTimeout(activeToasts[k]._timer);
          if (activeToasts[k].parentNode) activeToasts[k].parentNode.removeChild(activeToasts[k]);
        }
      }
    }

    function tickRealStream() {
      if (!state.realStream || !state.realStream.running) return;
      if (!state.realMetrics?.testScores) {
        stopRealStreamReplay();
        return;
      }

      const scores = state.realMetrics.testScores;
      const labels = state.realMetrics.testLabels;
      const N_test = scores.length;
      const th = state.model?.thresholds || state.model?.model?.thresholds || { decision: 0.50, review: 0.40, block: 0.75 };
      const thRev = Number(th.review ?? 0.40);
      const thBlock = Number(th.block ?? 0.75);

      const validIndices = state.realClean?.validIndices;
      const testIndices = state.realSplits?.test;

      const idx = state.realStream.currentIndex;
      if (idx >= N_test) {
        stopRealStreamReplay();
        updateRealStreamProgressUI();
        updateRealStreamControlsUI();
        return;
      }

      const s = scores[idx];
      const y = labels ? labels[idx] : 0;
      let action = 'Allow';
      if (s >= thBlock) action = 'Block';
      else if (s >= thRev) action = 'Review';

      const origRow = (validIndices && testIndices) ? (validIndices[testIndices[idx]] + 1) : (idx + 1);

      state.realStream.counts.replayed++;
      state.realStream.counts[action]++;
      if (action === 'Block' && y === 1) {
        state.realStream.counts.fraudsCaught++;
      }
      state.realStream.currentIndex++;

      state.realStream.recentRows.unshift({ origRow, s, action, y });
      if (state.realStream.recentRows.length > 100) {
        state.realStream.recentRows.pop();
      }

      const tbody = typeof document !== 'undefined' ? document.getElementById('realStreamBody') : null;
      if (tbody) {
        const tr = document.createElement('tr');
        const badgeClass = action.toLowerCase();
        const labelHtml = y === 1 ? '<span style="color:var(--red);font-weight:600">Fraud (1)</span>' : '<span class="muted">Legit (0)</span>';
        tr.innerHTML = `<td>${origRow}</td><td>${s.toFixed(4)}</td><td><span class="badge ${badgeClass}">${action}</span></td><td>${labelHtml}</td>`;
        tbody.prepend(tr);
        while (tbody.children.length > 100) {
          tbody.removeChild(tbody.lastElementChild);
        }
      }

      if (action === 'Block') {
        showRealBlockToast(origRow, s);
      }

      updateRealStreamCountersUI();
      updateRealStreamProgressUI();

      if (state.realStream.currentIndex >= N_test) {
        stopRealStreamReplay();
        updateRealStreamProgressUI();
        updateRealStreamControlsUI();
      }
    }

    function startRealStreamReplay() {
      if (!state.realMetrics?.testScores) return;
      const N_test = state.realMetrics.testScores.length;
      if (N_test === 0) return;

      if (state.realStream.currentIndex >= N_test) {
        resetRealStreamReplay();
      }

      stopRealStreamReplay();
      state.realStream.running = true;
      updateRealStreamControlsUI();
      updateRealStreamProgressUI();

      const speed = state.realStream.speed || 5;
      const interval = Math.max(25, Math.floor(1000 / speed));

      state.realStream.timer = setInterval(() => {
        tickRealStream();
      }, interval);
    }

    function pauseRealStreamReplay() {
      stopRealStreamReplay();
      updateRealStreamControlsUI();
      updateRealStreamProgressUI();
    }

    function resetRealStreamReplay() {
      stopRealStreamReplay();
      state.realStream.currentIndex = 0;
      state.realStream.recentRows = [];
      state.realStream.counts = { replayed: 0, Allow: 0, Review: 0, Block: 0, fraudsCaught: 0 };
      clearRealToasts();

      const tbody = typeof document !== 'undefined' ? document.getElementById('realStreamBody') : null;
      if (tbody) tbody.innerHTML = '';
      updateRealStreamCountersUI();
      updateRealStreamProgressUI();
      updateRealStreamControlsUI();
    }

    function setRealStreamSpeed(newSpeed) {
      state.realStream.speed = Number(newSpeed) || 5;
      if (state.realStream.running) {
        startRealStreamReplay();
      }
    }

    function updateRealStreamCountersUI() {
      if (typeof document === 'undefined') return;
      const c = state.realStream.counts;
      const elReplayed = document.getElementById('realCounterReplayed');
      const elAllow = document.getElementById('realCounterAllow');
      const elReview = document.getElementById('realCounterReview');
      const elBlock = document.getElementById('realCounterBlock');
      const elFrauds = document.getElementById('realCounterFraudsCaught');
      if (elReplayed) elReplayed.textContent = fmt(c.replayed);
      if (elAllow) elAllow.textContent = fmt(c.Allow);
      if (elReview) elReview.textContent = fmt(c.Review);
      if (elBlock) elBlock.textContent = fmt(c.Block);
      if (elFrauds) elFrauds.textContent = fmt(c.fraudsCaught);
    }

    function updateRealStreamProgressUI() {
      if (typeof document === 'undefined') return;
      const N_test = state.realMetrics?.testScores ? state.realMetrics.testScores.length : 0;
      const idx = state.realStream.currentIndex;
      const pct = N_test > 0 ? Math.min(100, (idx / N_test) * 100) : 0;
      const bar = document.getElementById('realStreamProgressBar');
      const txt = document.getElementById('realStreamProgressStatus');
      const badge = document.getElementById('realStreamStatusBadge');
      if (bar) bar.style.width = pct.toFixed(1) + '%';
      if (txt) {
        if (idx >= N_test && N_test > 0) {
          txt.textContent = 'Replay complete (' + fmt(N_test) + ' rows)';
        } else {
          txt.textContent = `${fmt(idx)} / ${fmt(N_test)} rows replayed (${pct.toFixed(1)}%)`;
        }
      }
      if (badge) {
        if (state.realStream.running) {
          badge.textContent = 'Streaming';
          badge.style.color = 'var(--accent)';
        } else if (idx >= N_test && N_test > 0) {
          badge.textContent = 'Complete';
          badge.style.color = 'var(--green)';
        } else if (idx > 0) {
          badge.textContent = 'Paused';
          badge.style.color = 'var(--yellow)';
        } else {
          badge.textContent = 'Idle';
          badge.style.color = 'var(--muted)';
        }
      }
    }

    function updateRealStreamControlsUI() {
      if (typeof document === 'undefined') return;
      const btnStart = document.getElementById('realStreamStart');
      const btnPause = document.getElementById('realStreamPause');
      const btnReset = document.getElementById('realStreamReset');
      if (btnStart) btnStart.disabled = state.realStream.running;
      if (btnPause) btnPause.disabled = !state.realStream.running;
      if (btnReset) btnReset.disabled = false;
    }

    function stage7Real() {
      if (!state.model || !state.realMetrics || !state.realMetrics.testScores) {
        return `<div class="card">

      const th = state.model?.thresholds || state.model?.model?.thresholds || { decision: 0.50, review: 0.40, block: 0.75 };

          </div>`

      return `

          </div>

          <div class="tablewrap">

          <div class="tablewrap" style="max-height:430px">

          <div class="notice warn" style="margin-top:10px">
