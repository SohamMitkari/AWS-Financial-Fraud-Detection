      const validIndices = state.realClean.validIndices;
      const testIndices = state.realSplits.test;
      const rawColumns = state.realData.rawColumns;
      const featCols = state.realClean.featureCols;
      const th = state.model?.thresholds || state.model?.model?.thresholds || { decision: 0.50, review: 0.40, block: 0.75 };

      const replay = computeRealReplay(scores, labels, validIndices, testIndices, rawColumns, featCols, th);
      const { N_test, thRev, thDec, thBlock, counts, totalFrauds, totalLegit } = replay;
      const m = state.realMetrics;

      const gainPoints = computeGainCurve(scores, labels);

      const actionItems = [
        { key: 'Block', label: 'Block', value: counts.Block.count, color: '#ff647c' },
        { key: 'Review', label: 'Review', value: counts.Review.count, color: '#f7c948' },
        { key: 'Allow', label: 'Allow', value: counts.Allow.count, color: '#39d98a' }
      ];

      const selectedFilter = state.realDashboardFilter || null;
      let displayRows = [];
      const numToShow = Math.min(100, N_test);
      for (let j = 0; j < N_test; j++) {
        const testIdx = replay.sortedIndices[j];
        const s = scores[testIdx];
        let action = 'Allow';
        if (s >= thBlock) action = 'Block';
        else if (s >= thRev) action = 'Review';

        if (!selectedFilter || selectedFilter === 'all' || selectedFilter === action) {
          const origIdx = (validIndices && testIndices) ? validIndices[testIndices[testIdx]] : testIdx;
          displayRows.push({
            origRow: origIdx + 1,
            score: s,
            action,
            label: labels ? labels[testIdx] : 0,
            f1: (featCols[0] && rawColumns) ? rawColumns.get(featCols[0])[origIdx] : null,
            f2: (featCols[1] && rawColumns) ? rawColumns.get(featCols[1])[origIdx] : null,
            f3: (featCols[2] && rawColumns) ? rawColumns.get(featCols[2])[origIdx] : null
          });
          if (displayRows.length >= numToShow) break;
        }
      }

      const f1Name = featCols[0] || 'Feature 1';
      const f2Name = featCols[1] || 'Feature 2';
      const f3Name = featCols[2] || 'Feature 3';

      const tableRowsHtml = displayRows.map(r => `
        <tr>
          <td><b>${r.origRow}</b></td>
          <td><b>${r.score.toFixed(4)}</b></td>
          <td><span class="badge ${r.action.toLowerCase() === 'allow' ? 'approve' : r.action.toLowerCase()}">${r.action}</span></td>
          <td>${r.label === 1 ? '<span style="color:var(--yellow);font-weight:700">Fraud (1)</span>' : '<span class="muted">Legitimate (0)</span>'}</td>
          <td>${r.f1 == null || isNaN(r.f1) ? '<span class="muted">NaN</span>' : Number(r.f1).toPrecision(6)}</td>
          <td>${r.f2 == null || isNaN(r.f2) ? '<span class="muted">NaN</span>' : Number(r.f2).toPrecision(6)}</td>
          <td>${r.f3 == null || isNaN(r.f3) ? '<span class="muted">NaN</span>' : Number(r.f3).toPrecision(6)}</td>
        </tr>
      `).join('');

      const streamRowsHtml = (state.realStream?.recentRows || []).map(r => {
        const badgeClass = r.action.toLowerCase();
        const labelHtml = r.y === 1 ? '<span style="color:var(--red);font-weight:600">Fraud (1)</span>' : '<span class="muted">Legit (0)</span>';
        return `<tr><td>${r.origRow}</td><td>${r.s.toFixed(4)}</td><td><span class="badge ${badgeClass}">${r.action}</span></td><td>${labelHtml}</td></tr>`;
      }).join('');

      return `
        <div class="grid g5">
          <div class="kpi">
            <div class="klabel">Test Rows</div>
            <div class="kvalue">${fmt(N_test)}</div>
            <div class="muted" style="font-size:11px">100% held out</div>
          </div>
          <div class="kpi">
            <div class="klabel">True Frauds</div>
            <div class="kvalue" style="color:var(--yellow)">${fmt(totalFrauds)}</div>
            <div class="muted" style="font-size:11px">${(totalFrauds / Math.max(1, N_test) * 100).toFixed(2)}% prevalence</div>
          </div>
          <div class="kpi" style="border:1px solid var(--accent);background:rgba(88,166,255,0.08)">
            <div class="klabel" style="color:var(--accent);font-weight:700">PR-AUC (Headline)</div>
            <div class="kvalue" style="color:var(--yellow)">${m.pr_auc.toFixed(4)}</div>
            <div class="muted" style="font-size:11px">Step-wise Average Precision</div>
          </div>
          <div class="kpi">
            <div class="klabel">Recall (@ $T_{\text{dec}} = ${thDec.toFixed(2)})</div>
            <div class="kvalue" style="color:var(--green)">${(m.recall * 100).toFixed(2)}%</div>
            <div class="muted" style="font-size:11px">${fmt(m.confusion.tp)} / ${fmt(totalFrauds)} caught</div>
          </div>
          <div class="kpi">
            <div class="klabel">Precision (@ $T_{\text{dec}} = ${thDec.toFixed(2)})</div>
            <div class="kvalue">${(m.precision * 100).toFixed(2)}%</div>
            <div class="muted" style="font-size:11px">${fmt(m.confusion.tp)} / ${fmt(m.confusion.tp + m.confusion.fp)} alerts</div>
          </div>
        </div>

        <div class="grid g3" style="margin-top:14px">
          <div class="card chart-card">
            <div class="chart-title">Action Counts</div>
            ${verticalBarChart(actionItems, 'dashboardReal', selectedFilter)}
          </div>
          <div class="card chart-card">
            <div class="chart-title">Score Distribution (by Class)</div>
            ${renderClassScoreHistogram(scores, labels)}
          </div>
          <div class="card chart-card">
            <div class="chart-title">Cumulative Gain Curve</div>
            ${renderGainCurveSvg(gainPoints)}
          </div>
        </div>

        <!-- Live Replay Stream Panel -->
        <div class="card" style="margin-top:14px">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px">
            <div style="display:flex;align-items:center;gap:10px">
              <h3 style="margin:0">Live Replay Stream</h3>
              <span id="realStreamStatusBadge" class="badge" style="background:rgba(88,166,255,0.15);color:var(--accent)">${state.realStream.running ? 'Streaming' : (state.realStream.currentIndex >= N_test && N_test > 0 ? 'Complete' : (state.realStream.currentIndex > 0 ? 'Paused' : 'Idle'))}</span>
            </div>
            <div class="controls" style="margin:0;display:flex;align-items:center;gap:8px">
              <button id="realStreamStart" class="primary" style="padding:5px 12px;font-size:12px" ${state.realStream.running ? 'disabled' : ''}>Start</button>
              <button id="realStreamPause" class="secondary" style="padding:5px 12px;font-size:12px" ${!state.realStream.running ? 'disabled' : ''}>Pause</button>
              <button id="realStreamReset" class="secondary" style="padding:5px 12px;font-size:12px">Reset</button>
              <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin:0">
                Speed:
                <select id="realStreamSpeed" style="background:#0b1324;border:1px solid var(--line);color:#eef4ff;padding:4px 8px;border-radius:4px;font-size:12px">
                  <option value="1" ${state.realStream.speed === 1 ? 'selected' : ''}>1 row/s</option>
                  <option value="5" ${state.realStream.speed === 5 || !state.realStream.speed ? 'selected' : ''}>5 rows/s</option>
                  <option value="20" ${state.realStream.speed === 20 ? 'selected' : ''}>20 rows/s</option>
                </select>
              </label>
            </div>
          </div>

          <div class="muted" style="margin-bottom:12px;font-size:12px">Simulated stream: replaying held-out test rows, not a live feed</div>

          <div style="margin-bottom:14px">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font-size:12px">
              <span id="realStreamProgressStatus" class="muted">${state.realStream.currentIndex >= N_test && N_test > 0 ? 'Replay complete (' + fmt(N_test) + ' rows)' : `${fmt(state.realStream.counts.replayed)} / ${fmt(N_test)} rows replayed (${((state.realStream.currentIndex / (N_test || 1)) * 100).toFixed(1)}%)`}</span>
              <span class="muted" style="font-size:11px">Max 100 recent rows displayed</span>
            </div>
            <div style="height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden">
              <div id="realStreamProgressBar" style="height:100%;background:var(--accent);width:${((state.realStream.currentIndex / (N_test || 1)) * 100).toFixed(1)}%;transition:width 0.1s linear"></div>
            </div>
          </div>

          <div class="grid g5" style="margin-bottom:14px">
            <div class="mini">
              <div class="klabel">Rows Replayed</div>
              <div id="realCounterReplayed" class="kvalue" style="font-size:18px">${fmt(state.realStream.counts.replayed)}</div>
            </div>
            <div class="mini">
              <div class="klabel">Allow</div>
              <div id="realCounterAllow" class="kvalue" style="font-size:18px;color:var(--green)">${fmt(state.realStream.counts.Allow)}</div>
            </div>
            <div class="mini">
              <div class="klabel">Review</div>
              <div id="realCounterReview" class="kvalue" style="font-size:18px;color:var(--yellow)">${fmt(state.realStream.counts.Review)}</div>
            </div>
            <div class="mini">
              <div class="klabel">Block</div>
              <div id="realCounterBlock" class="kvalue" style="font-size:18px;color:var(--red)">${fmt(state.realStream.counts.Block)}</div>
            </div>
            <div class="mini">
              <div class="klabel">Frauds in Blocks</div>
              <div id="realCounterFraudsCaught" class="kvalue" style="font-size:18px;color:#fca5a5">${fmt(state.realStream.counts.fraudsCaught)}</div>
            </div>
          </div>

          <div class="tablewrap" style="max-height:360px">
            <table class="live-table" id="realStreamTable">
              <thead>
                <tr>
                  <th>Row</th>
                  <th>Score</th>
                  <th>Action</th>
                  <th>True Label</th>
                </tr>
              </thead>
              <tbody id="realStreamBody">
                ${streamRowsHtml}
              </tbody>
            </table>
          </div>
        </div>
        <div id="realToastContainer" class="real-toast-container"></div>

        <div class="card" style="margin-top:14px">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px">
            <h3 style="margin:0">Held-Out Test Set Replay ${selectedFilter ? `— Filter: ${esc(selectedFilter)}` : ''}</h3>
            <div class="controls" style="margin:0">
              <button class="${!selectedFilter || selectedFilter === 'all' ? 'primary' : 'secondary'}" data-real-dash-filter="all">All (${fmt(N_test)})</button>
              <button class="${selectedFilter === 'Block' ? 'primary' : 'secondary'}" data-real-dash-filter="Block">Block (${fmt(counts.Block.count)})</button>
              <button class="${selectedFilter === 'Review' ? 'primary' : 'secondary'}" data-real-dash-filter="Review">Review (${fmt(counts.Review.count)})</button>
              <button class="${selectedFilter === 'Allow' ? 'primary' : 'secondary'}" data-real-dash-filter="Allow">Allow (${fmt(counts.Allow.count)})</button>
            </div>
          </div>
          <div class="muted" style="margin-bottom:10px">Showing ${displayRows.length} transactions sorted by risk score descending.</div>
          <div class="tablewrap" style="max-height:430px">
            <table class="live-table">
              <thead>
                <tr>
                  <th>Row</th>
                  <th>Fraud Score</th>
                  <th>Triage Action</th>
                  <th>Ground Truth</th>
                  <th>${esc(f1Name)}</th>
                  <th>${esc(f2Name)}</th>
                  <th>${esc(f3Name)}</th>
                </tr>
              </thead>
              <tbody>
                ${tableRowsHtml}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function stage7() {
      if (state.datasetMode === 'real') return stage7Real();
      const s = state.score || [], c = triageCounts(s);
      const items = [
        { key: 'Approve', label: 'Approve', value: c.Approve, color: '#39d98a' },
        { key: 'Review', label: 'Review', value: c.Review, color: '#f7c948' },
        { key: 'Block', label: 'Block', value: c.Block, color: '#ff647c' }
      ];
      const filtered = state.stage7Selected ? s.filter(x => x.audit_action === state.stage7Selected) : s;
      return `${action(6, 'Score transactions using exported LightGBM decision trees and assign Approve, Review or Block.')}
  <div class="grid g3">
    <div class="card chart-card"><div class="chart-title">Decision Bar Chart</div>${barChart(items)}</div>
    <div class="card chart-card"><div class="chart-title">Decision Donut</div>${donutBlock(items, 'Decisions', state.stage7Selected, 'stage7')}</div>
    <div class="card chart-card"><div class="chart-title">Operational Triage Funnel</div>${funnelChart([
        { key: 'Audited', label: 'Audited', value: s.length },
        { key: 'Suspect', label: 'Suspect', value: c.Review + c.Block },
        { key: 'Review', label: 'Review', value: c.Review },
        { key: 'Block', label: 'Block', value: c.Block }
      ], 'stage7', state.stage7Selected)}</div>
  </div>
  <div class="card"><h3>Operational Scoring Results ${state.stage7Selected ? `— Filtered: ${esc(state.stage7Selected)}` : ''}</h3>${table(filtered, Object.keys(s[0] || {}).filter(x => x !== '_seq'), 'scoretbl', true)}</div>`;
    }

    function dashboard() {
      if (state.datasetMode === 'real') return dashboardReal();
      const s = state.score || [];
      const testRows = s.filter(x => x.split === 'test');
      const testBlocks = testRows.filter(x => x.audit_action === 'Block');
      const testBlockCount = testBlocks.length;
      const testFraudCaught = testBlocks.filter(x => +x.isFraud === 1).length;
      const testTotalFraud = testRows.filter(x => +x.isFraud === 1).length;
      const testPrec = testBlockCount > 0 ? (testFraudCaught / testBlockCount) : 0;
      const testRec = testTotalFraud > 0 ? (testFraudCaught / testTotalFraud) : 0;

      const trainRows = s.filter(x => x.split === 'train');
      const trainBlocks = trainRows.filter(x => x.audit_action === 'Block');
      const trainBlockCount = trainBlocks.length;
      const trainFraudCaught = trainBlocks.filter(x => +x.isFraud === 1).length;
      const trainTotalFraud = trainRows.filter(x => +x.isFraud === 1).length;
      const trainPrec = trainBlockCount > 0 ? (trainFraudCaught / trainBlockCount) : 0;
      const trainRec = trainTotalFraud > 0 ? (trainFraudCaught / trainTotalFraud) : 0;

      const live = state.liveRows || [], c = triageCounts(live.length ? live : s);
      const totalStream = live.length;
      const vol = (live.length ? live : s).reduce((a, x) => a + (+x.amount || 0), 0);
      const items = [
        { key: 'Approve', label: 'Approve', value: c.Approve, color: '#39d98a' },
        { key: 'Review', label: 'Review', value: c.Review, color: '#f7c948' },
        { key: 'Block', label: 'Block', value: c.Block, color: '#ff647c' }
      ];
      const funnel = [
        { key: 'Live Records', label: 'Live Records', value: totalStream },
        { key: 'Suspect', label: 'Suspect', value: c.Review + c.Block },
        { key: 'Review', label: 'Review', value: c.Review },
        { key: 'Block', label: 'Block', value: c.Block }
      ];

      const ls = state.liveStats;
      const livePrec = ls.tp / (ls.tp + ls.fp) || 0;
      const liveRec = ls.tp / (ls.tp + ls.fn) || 0;

      return `<div class="grid g4">
    <div class="kpi"><div class="klabel">Block count</div><div class="kvalue" style="color:var(--red)">${testRows.length ? fmt(testBlockCount) : '—'}</div></div>
    <div class="kpi"><div class="klabel">Fraud caught</div><div class="kvalue" style="color:var(--yellow)">${testRows.length ? fmt(testFraudCaught) : '—'}</div></div>
    <div class="kpi"><div class="klabel">Precision</div><div class="kvalue">${testRows.length ? (testPrec * 100).toFixed(2) + '%' : '—'}</div></div>
    <div class="kpi"><div class="klabel">Recall</div><div class="kvalue">${testRows.length ? (testRec * 100).toFixed(2) + '%' : '—'}</div></div>
  </div>

  <div class="card" style="margin-top:14px">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <div style="font-weight:700;font-size:13px">In-sample Training Performance</div>
      <span class="badge in-sample">in-sample</span>
    </div>
    <div class="grid g4" style="margin-top:10px">
      <div class="kpi"><div class="klabel">In-sample Rows</div><div class="kvalue">${trainRows.length ? fmt(trainRows.length) : '—'}</div></div>
      <div class="kpi"><div class="klabel">In-sample Block Count</div><div class="kvalue" style="color:var(--red)">${trainRows.length ? fmt(trainBlockCount) : '—'}</div></div>
      <div class="kpi"><div class="klabel">In-sample Fraud Caught</div><div class="kvalue" style="color:var(--yellow)">${trainRows.length ? `${fmt(trainFraudCaught)} / ${fmt(trainTotalFraud)}` : '—'}</div></div>
      <div class="kpi"><div class="klabel">In-sample Precision / Recall</div><div class="kvalue">${trainRows.length ? `${(trainPrec * 100).toFixed(2)}% / ${(trainRec * 100).toFixed(2)}%` : '—'}</div></div>
    </div>
  </div>

  <div class="grid g3" style="margin-top:14px">
    <div class="card chart-card"><div class="chart-title">Live Decision Bar Chart</div><div id="dashBar">${verticalBarChart(items, 'dashboard', state.dashboardSelected)}</div></div>
    <div class="card chart-card"><div class="chart-title">Live Decision Donut</div><div id="dashDonut">${donutBlock(items, 'Live Window', state.dashboardSelected, 'dashboard')}</div></div>
    <div class="card chart-card"><div class="chart-title">Live Decision Funnel</div><div id="dashFunnel">${funnelChart(funnel, 'dashboard', state.dashboardSelected)}</div></div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><h2 style="margin:0">Visual Filter</h2><button id="clearDashFilter" class="secondary" ${state.dashboardSelected ? '' : 'disabled'}>Clear Filter</button></div>
    <div id="dashFilterInfo" class="notice">${getDashboardFilterLabel()}</div>
  </div>

  <div class="card"><h2>Simulated Stream</h2>
    <div class="muted">Every tick generates new real-time transactions, maintains causal history, scores them using the trained model, and applies the operational thresholds. Visuals refresh every 10 seconds.</div>
    <div id="liveStreamNotice" class="notice" style="margin-top:10px">
      Simulated stream window: ${fmt(totalStream)} buffered &bull; Streaming Model: <b>${esc(state.modelSource)}</b> &bull; Running Live Precision: <b>${(livePrec * 100).toFixed(1)}%</b>, Recall: <b>${(liveRec * 100).toFixed(1)}%</b>
    </div>
    <div class="tablewrap" style="margin-top:12px;max-height:430px">
      <table class="live-table"><thead><tr><th>Sequence</th><th>Step</th><th>Type</th><th>Amount</th><th>Origin</th><th>Fraud Score</th><th>Predicted Action</th><th>Simulated Ground Truth</th></tr></thead><tbody id="livebody"></tbody></table>
    </div>
  </div>`;
    }

    function render(i) {
      if (i !== 7) {
        stopRealStreamReplay();
      }
      state.stage = i;
      $('title').textContent = STAGES[i]; $('sub').textContent = DESC[i];
      nav();

      // Banner for backend status
      const bBanner = $('backendBanner');
      if (bBanner) {
        if (state.modelSource === 'Fallback: logistic regression (cloud model unavailable)') {
          bBanner.innerHTML = `<div class="notice warn" style="margin-bottom:14px">Cloud backend unreachable (${esc(state.backendError || 'offline')}) — using verified in-browser fallback model. Note: Fallback uses pure-JS logistic regression, not LightGBM.</div>`;
        } else {
          bBanner.innerHTML = '';
        }
      }

      let h = '';
      if (i === 0) h = stage1();
      if (i === 1) h = stage2();
      if (i === 2) h = stage3();
      if (i === 3) h = stage4();
      if (i === 4) h = stage5();
      if (i === 5) h = stage6();
      if (i === 6) h = state.datasetMode === 'real' ? stage7Real() : stage7();
      if (i === 7) h = state.datasetMode === 'real' ? dashboardReal() : dashboard();
      $('app').innerHTML = h;
      bind(i);
    }

    function bind(i) {
      const modeSyn = $('modeSynthetic');
      if (modeSyn) modeSyn.onclick = () => {
        if (state.datasetMode !== 'synthetic') {
          state.datasetMode = 'synthetic';
          resetDownstream();
          render(0);
        }
      };
      const modeReal = $('modeReal');
      if (modeReal) modeReal.onclick = () => {
        if (state.datasetMode !== 'real') {
          state.datasetMode = 'real';
          resetDownstream();
          render(0);
        }
      };

      const r = $('run');
      if (r) r.onclick = () => {
        if (state.datasetMode === 'real') {
          if (state.auto) {
            if (!state.realData) {
              $('app').insertAdjacentHTML('afterbegin', '<div class="notice error">Load a real dataset first.</div>');
              return;
            }
            runAutomaticStage(i);
          } else {
            runManualStage(i);
          }
        } else if (state.auto && i === 0) {
          if (!state.raw.length) state.raw = state.baseRaw.map(x => ({ ...x }));
          runAutomaticStage(0);
        } else if (i === 4) {
          const tr = state.auto ? 70 : Number($('trainPct')?.value);
          const te = state.auto ? 30 : Number($('testPct')?.value);
          if (!state.auto && (!Number.isInteger(tr) || !Number.isInteger(te) || tr < 1 || te < 1 || tr + te !== 100)) {
            const msg = $('splitMsg'); if (msg) msg.textContent = 'Training and testing percentages must be whole numbers and total 100%.';
            return;
          }
          state.trainPct = tr; state.testPct = te;
          runStage(i, state.auto);
        } else {
          runManualStage(i);
        }
      };

      if (i === 0) {
        if (state.datasetMode === 'real') {
          const fileInput = $('realCsvFile');
          if (fileInput) {
            fileInput.onchange = async () => {
              const file = fileInput.files[0];
              if (!file) return;
              const msg = $('realMsg');
              if (msg) msg.innerHTML = '<div class="notice">Streaming &amp; parsing CSV (cap: 300,000)...</div>';
              try {
                const parsed = await streamParseCSV(file.stream(), {
                  onProgress: (count) => {
                    if (msg) msg.innerHTML = `<div class="notice">Read ${fmt(count)} rows...</div>`;
                  }
                });
                const detected = autoDetectColumns(parsed.headers, parsed.rawColumns, parsed.rawRowCount, parsed.nonNumericMap);
                state.realData = processRealColumns(parsed, detected.labelCol, detected.orderCol);
                resetDownstream();
                render(0);
                const newMsg = $('realMsg');
                if (newMsg) {
                  newMsg.innerHTML = `<div class="notice success">Successfully ingested ${fmt(state.realData.rowCount)} records with label column '${state.realData.labelCol}' (order: '${state.realData.orderCol}').</div>`;
                }
              } catch (err) {
                if (msg) msg.innerHTML = `<div class="notice error">Failed to parse CSV: ${esc(err.message)}</div>`;
              }
            };
          }

          const labelSel = $('realLabelSelect');
          if (labelSel) {
            labelSel.onchange = () => {
              if (!state.realData) return;
              state.realData = processRealColumns(state.realData._rawParsed, labelSel.value, state.realData.orderCol);
              resetDownstream();
              render(0);
            };
          }

          const orderSel = $('realOrderSelect');
          if (orderSel) {
            orderSel.onchange = () => {
              if (!state.realData) return;
              state.realData = processRealColumns(state.realData._rawParsed, state.realData.labelCol, orderSel.value);
              resetDownstream();
              render(0);
            };
          }

          if (state.realData && state.realData.sampleRows.length) {
            mount(state.realData.sampleRows, state.realData.headers, 'realtbl', false);
          }
        } else {
          $('append').onclick = () => {
            const entered = Number($('n').value);
            if (!Number.isFinite(entered) || entered <= 0) {
              $('msg').innerHTML = '<div class="notice warn">Enter a record count greater than 0 before appending.</div>';
              return;
            }
            const n = Math.min(500000, Math.floor(entered));
            state.raw = state.raw.concat(generate(n, Date.now()));
            resetDownstream();
            render(0);
            const input = $('n'); if (input) input.value = 0;
            const msg = $('msg'); if (msg) msg.innerHTML = `<div class="notice success">Appended ${fmt(n)} records. Active dataset: ${fmt(state.raw.length)}. Record input reset to 0 for next append.</div>`;
          };

          $('replace').onclick = () => {
            const f = $('file').files[0];
            if (!f) { $('msg').innerHTML = '<div class="notice warn">Select a CSV file first.</div>'; return; }
            const rd = new FileReader();
            rd.onload = () => {
              try {
                const parsed = parseCSV(rd.result);
                if (!parsed.length) throw new Error('No records found in CSV.');
                parsed.sort((a, b) => a.step - b.step);
                state.raw = parsed;
                resetDownstream();
                render(0);
                const input = $('n'); if (input) input.value = 0;
                const msg = $('msg'); if (msg) msg.innerHTML = `<div class="notice success">Loaded &amp; validated ${fmt(state.raw.length)} chronological records from CSV.</div>`;
              } catch (e) {
                $('msg').innerHTML = `<div class="notice error">${esc(e.message)}</div>`;
              }
            };
            rd.readAsText(f);
          };

          $('resetData').onclick = () => {
            state.raw = state.baseRaw.map(x => ({ ...x }));
            resetDownstream();
            render(0);
            const input = $('n'); if (input) input.value = 50000;
            const msg = $('msg'); if (msg) msg.innerHTML = '<div class="notice success">Active dataset reset to preloaded 50,000 historical records.</div>';
          };

          $('download').onclick = () => downloadCSV(state.raw);
          mount(state.raw, RAW_COLS, 'rawtbl', true);
        }
      }

      if (i === 1) {
        if (state.datasetMode === 'real') {
          if (state.realClean && state.realClean.cleanSampleRows?.length) {
            mount(state.realClean.cleanSampleRows, Object.keys(state.realClean.cleanSampleRows[0]), 'realcleantbl', false);
          }
        } else if (state.clean) {
          mount(state.clean, RAW_COLS, 'cleantbl', true);
        }
      }

      if (i === 2) {
        mount(state.edaSelected ? (state.clean || []).filter(x => x.type === state.edaSelected) : (state.clean || []), ['step', 'type', 'amount', 'nameOrig', 'nameDest', 'isFraud'], 'edatbl', true);
        document.querySelectorAll('[data-visual-pick^="eda|"]').forEach(el => el.addEventListener('click', () => {
          const pick = el.dataset.visualPick.split('|')[1];
          if (pick === 'Fraud' || pick === 'Non-Fraud') return;
          state.edaSelected = state.edaSelected === pick ? null : pick;
          render(2);
        }));
      }

      if (i === 3 && state.feat) mount(state.feat, Object.keys(state.feat[0]), 'feattbl', true);

      if (i === 4) {
        const trInput = $('trainPct'), teInput = $('testPct'), msg = $('splitMsg');
        if (trInput && teInput && !state.auto) {
          const syncFromTraining = () => {
            let tr = Math.round(Number(trInput.value) || 70);
            tr = Math.min(99, Math.max(1, tr));
            let te = 100 - tr;
            trInput.value = tr; teInput.value = te;
            state.trainPct = tr; state.testPct = te;
            if (msg) msg.textContent = `Balanced partition: Training ${tr}% • Testing ${te}%`;
          };
          const syncFromTesting = () => {
            let te = Math.round(Number(teInput.value) || 30);
            te = Math.min(99, Math.max(1, te));
            let tr = 100 - te;
            teInput.value = te; trInput.value = tr;
            state.trainPct = tr; state.testPct = te;
            if (msg) msg.textContent = `Balanced partition: Training ${tr}% • Testing ${te}%`;
          };
          trInput.addEventListener('input', syncFromTraining);
          teInput.addEventListener('input', syncFromTesting);
          if (msg) msg.textContent = `Balanced partition: Training ${trInput.value}% • Testing ${teInput.value}%`;
        }
      }

      if (i === 5) {
        const keyInput = $('trainApiKeyInput');
        if (keyInput) {
          keyInput.addEventListener('input', () => {
            const v = keyInput.value.trim();
            if (typeof sessionStorage !== 'undefined') {
              if (v) sessionStorage.setItem('TRAIN_API_KEY', v);
              else sessionStorage.removeItem('TRAIN_API_KEY');
            }
          });
        }
        const verifyBtn = $('verifyParity');
        if (verifyBtn) verifyBtn.onclick = async () => {
          const pMsg = $('parityMsg');
          if (!API_BASE || API_BASE.includes('your-api-id')) {
            if (pMsg) pMsg.innerHTML = '<span style="color:var(--yellow)">Set API_BASE in <code>frontend/config.js</code> to test live parity.</span>';
            return;
          }
          if (pMsg) pMsg.textContent = 'Calling POST /predict with test sample rows...';
          try {
            let X;
            if (state.datasetMode === 'real') {
              if (!state.realSplits?.test || !state.realData || !state.realClean) throw new Error('Real test partition not available');
              const d = state.realClean.featureCols.length;
              const testSub = state.realSplits.test.subarray(0, Math.min(200, state.realSplits.test.length));
              const validIndices = state.realClean.validIndices;
              const featColsData = state.realClean.featureCols.map(c => state.realData.rawColumns.get(c));
              X = [];
              for (let r = 0; r < testSub.length; r++) {
                const origIdx = validIndices[testSub[r]];
                const row = new Array(d);
                for (let j = 0; j < d; j++) {
                  const v = featColsData[j][origIdx];
                  row[j] = (v == null || isNaN(v)) ? null : v;
                }
                X.push(row);
              }
            } else {
              const testRows = state.test.slice(0, 200);
              const { X: synX } = extractCausalFeatures(testRows);
              X = synX;
            }
            const headers = { "Content-Type": "application/json" };

            const resp = await fetch(API_BASE.replace(/\/+$/, '') + '/predict', {
              method: 'POST',
              headers,
              body: JSON.stringify({ features: X })
            });
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();

            // Calculate JS scores using pure-JS tree scorer
            let maxDiff = 0;
            for (let r = 0; r < X.length; r++) {
              const jsScore = scoreRow(state.model, X[r]);
              const diff = Math.abs(jsScore - data.scores[r]);
              if (diff > maxDiff) maxDiff = diff;
            }
            if (maxDiff < 1e-6) {
              if (pMsg) pMsg.innerHTML = `<span style="color:var(--green)">✓ Parity Verified: ${X.length} rows matched cloud predictions (max diff: ${maxDiff.toExponential(3)}, pass criterion &lt; 1e-6).</span>`;
            } else {
              if (pMsg) pMsg.innerHTML = `<span style="color:var(--yellow)">Parity check: max diff was ${maxDiff.toExponential(3)}</span>`;
            }
          } catch (err) {
            if (pMsg) pMsg.innerHTML = `<span style="color:var(--red)">Parity check failed: ${esc(err.message)}</span>`;
          }
        };
      }

      if (i === 6 && state.score) {
        const filtered = state.stage7Selected ? state.score.filter(x => x.audit_action === state.stage7Selected) : state.score;
        mount(filtered, Object.keys(state.score[0]).filter(x => x !== '_seq'), 'scoretbl', true);
        bindVisualFilters('stage7');
      }

      if (i === 7) {
        if (state.datasetMode === 'real') {
          const btnStart = $('realStreamStart');
          if (btnStart) btnStart.onclick = () => startRealStreamReplay();
          const btnPause = $('realStreamPause');
          if (btnPause) btnPause.onclick = () => pauseRealStreamReplay();
          const btnReset = $('realStreamReset');
          if (btnReset) btnReset.onclick = () => resetRealStreamReplay();
          const selSpeed = $('realStreamSpeed');
          if (selSpeed) selSpeed.onchange = (e) => setRealStreamSpeed(e.target.value);

          document.querySelectorAll('[data-real-dash-filter]').forEach(btn => {
            btn.onclick = () => {
              const f = btn.getAttribute('data-real-dash-filter');
              state.realDashboardFilter = (f === 'all' || state.realDashboardFilter === f) ? null : f;
              render(7);
            };
          });
          document.querySelectorAll('[data-visual-pick^="dashboardReal|"]').forEach(el => {
            el.onclick = () => {
              const pick = el.dataset.visualPick.split('|')[1];
              state.realDashboardFilter = state.realDashboardFilter === pick ? null : pick;
              render(7);
            };
          });
        } else {
          renderLiveBody();
          notifyNewFraudBlocks();
          bindVisualFilters('dashboard');
          const closePopup = $('fraudPopupClose');
          if (closePopup) closePopup.onclick = () => $('fraudPopup').classList.remove('show');
          const clear = $('clearDashFilter');
          if (clear) clear.onclick = () => { state.dashboardSelected = null; refreshDashboardFilter(); };
          startDashboardRefresh();
        }
      }
    }

    function renderLiveBody() {
      const b = $('livebody'); if (!b) return;
      const rows = getDashboardFilteredRows();
      b.innerHTML = rows.slice(0, 240).map(x => `<tr>
    <td>${x._seq}</td><td>${x.step}</td><td>${esc(x.type)}</td><td>${money(x.amount)}</td>
    <td>${esc(x.nameOrig)}</td>
    <td>${(+x.fraud_score).toFixed(4)}</td>
    <td><span class="badge ${x.audit_action.toLowerCase()}">${x.audit_action}</span></td>
    <td><span class="muted">${+x.isFraud === 1 ? 'Fraud (1)' : 'Legit (0)'}</span></td>
  </tr>`).join('');
    }

    function refreshDashboardFilter() {
      if (state.stage !== 7) return;
      const c = triageCounts(state.liveRows.length ? state.liveRows : state.score || []);
      const items = [
        { key: 'Approve', label: 'Approve', value: c.Approve, color: '#39d98a' },
        { key: 'Review', label: 'Review', value: c.Review, color: '#f7c948' },
        { key: 'Block', label: 'Block', value: c.Block, color: '#ff647c' }
      ];
      const funnel = [
        { key: 'Live Records', label: 'Live Records', value: state.liveRows.length },
        { key: 'Suspect', label: 'Suspect', value: c.Review + c.Block },
        { key: 'Review', label: 'Review', value: c.Review },
        { key: 'Block', label: 'Block', value: c.Block }
      ];
      if ($('dashBar')) $('dashBar').innerHTML = verticalBarChart(items, 'dashboard', state.dashboardSelected);
      if ($('dashDonut')) $('dashDonut').innerHTML = donutBlock(items, 'Live Window', state.dashboardSelected, 'dashboard');
      if ($('dashFunnel')) $('dashFunnel').innerHTML = funnelChart(funnel, 'dashboard', state.dashboardSelected);
      if ($('dashFilterInfo')) $('dashFilterInfo').textContent = getDashboardFilterLabel();
      if ($('clearDashFilter')) $('clearDashFilter').disabled = !state.dashboardSelected;
      bindVisualFilters('dashboard');
      renderLiveBody();
    }

    // 5. Live Continuous Transaction Stream Generator & Model Scorer
    function scoreNewLiveTransaction(r) {
      if (!state.model) {
        return { ...r, fraud_score: 0.01, audit_action: 'Approve', split: 'live' };
      }

      const amount = Number(r.amount) || 0;
      const step = Number(r.step) || 1;
      const orig = String(r.nameOrig || '');
      const dest = String(r.nameDest || '');
      const oState = state.liveCausalOrig.get(orig) || { count: 0, total: 0, steps: [] };
      const dState = state.liveCausalDest.get(dest) || { count: 0, max: 0 };

      const vec = buildFeatureVector(r, oState, dState);

      // Model forward inference using tree scorer (zero label leakage)
      const th = state.model.model?.thresholds || state.model.thresholds || { decision: 0.50, review: 0.40, block: 0.75 };
      const s = +scoreRow(state.model, vec).toFixed(4);
      const action = s >= th.block ? 'Block' : s >= th.review ? 'Review' : 'Approve';

      // Update live stream causal state strictly after computing features
      state.liveCausalOrig.set(orig, {
        count: oState.count + 1,
        total: oState.total + amount,
        steps: [...oState.steps.filter(s => s > step - 48), step]
      });
      state.liveCausalDest.set(dest, {
        count: dState.count + 1,
        max: Math.max(dState.max, amount)
      });

      // Track live evaluation stats
      const actual = +r.isFraud === 1 ? 1 : 0;
      const predicted = action === 'Block' ? 1 : 0;
      if (predicted === 1 && actual === 1) state.liveStats.tp++;
      else if (predicted === 1 && actual === 0) state.liveStats.fp++;
      else if (predicted === 0 && actual === 1) state.liveStats.fn++;
      else state.liveStats.tn++;

      return { ...r, fraud_score: s, audit_action: action, split: 'live' };
    }

    function startLive() {
      stopLive();
      if (!state.score?.length) return;
      // Initialize stream with the most recent scored rows
      state.liveRows = state.score.slice(-60).reverse();
      state.liveIndex = state.score.length + 1;
      if (!state.liveGenerator) {
        state.liveGenerator = createGenerator(state.liveSeed, state.score.length);
      }

      state.live = setInterval(() => {
        // Generate 2 brand-new live transactions every second
        const newTxns = state.liveGenerator.generate(2);
        for (const t of newTxns) {
          const scored = scoreNewLiveTransaction(t);
          scored._seq = state.liveIndex++;
          state.liveRows.unshift(scored);
        }
        state.liveRows = state.liveRows.slice(0, 240);
        if (state.stage === 7) renderLiveBody();
      }, 1000);
    }

    function stopLive() {
      if (state.live) { clearInterval(state.live); state.live = null; }
      if (state.dashboardRefresh) { clearInterval(state.dashboardRefresh); state.dashboardRefresh = null; }
    }

    function startDashboardRefresh() {
      if (state.dashboardRefresh) clearInterval(state.dashboardRefresh);
      state.dashboardRefresh = setInterval(() => {
        if (state.stage === 7) refreshDashboardVisuals();
      }, 10000);
    }

    function showFraudBlockedPopup(count) {
      const popup = $('fraudPopup'), text = $('fraudPopupText');
      if (!popup || !text || count <= 0) return;
      text.textContent = `${fmt(count)} transaction${count === 1 ? '' : 's'} auto-blocked by the model based on high fraud risk score.`;
      popup.classList.add('show');
      if (state.fraudPopupTimer) clearTimeout(state.fraudPopupTimer);
      state.fraudPopupTimer = setTimeout(() => {
        popup.classList.remove('show');
        state.fraudPopupTimer = null;
      }, 3500);
    }

    function notifyNewFraudBlocks() {
      const rows = state.liveRows || [];
      if (!rows.length) return;
      let count = 0;
      for (const row of rows) {
        // Trigger pop-up strictly on predicted model action === 'Block', never on ground truth!
        if (row.audit_action === 'Block' && row._seq != null && !state.dashboardFraudSeen.has(row._seq)) {
          state.dashboardFraudSeen.add(row._seq);
          count++;
        }
      }
      if (state.dashboardFraudSeen.size > 1000) {
        const liveIds = new Set(rows.map(r => r._seq));
        state.dashboardFraudSeen = new Set([...state.dashboardFraudSeen].filter(id => liveIds.has(id)));
      }
      if (count > 0) showFraudBlockedPopup(count);
    }

    function refreshDashboardVisuals() {
      if (state.stage !== 7) return;
      notifyNewFraudBlocks();
      refreshDashboardFilter();
      const liveNotice = $('liveStreamNotice') || $('app').querySelectorAll('.notice')[1];
      if (liveNotice) liveNotice.innerHTML = `Simulated stream window: ${fmt(state.liveRows.length)} records currently buffered &bull; visuals refreshed ${new Date().toLocaleTimeString()} &bull; Model: ${esc(state.modelSource)}`;
    }

    $('auto').onchange = () => {
      if (state.running) { $('auto').checked = state.auto; return; }
      state.auto = $('auto').checked;
      state.autoWaiting = false;
      if (state.auto) {
        render(0);
        setStatus('Auto mode armed — waiting for Stage 1 execution');
      } else {
        setStatus('Manual mode');
        render(state.stage);
      }
    };

    $('reset').onclick = () => {
      resetToBaseline();
    };

    state.trainPct = 70;
    state.testPct = 30;
    state.baseRaw = generate(50000, 20261006);
    state.raw = state.baseRaw.map(r => ({ ...r }));
    setStatus('Idle');
    render(0);

    if (typeof window !== 'undefined') {
      window.scoreRow = scoreRow;
      window.flattenTree = flattenTree;
      window.prepareModelTrees = prepareModelTrees;
      window.state = state;
      window.resetToBaseline = resetToBaseline;
      window.render = render;
      window.mulberry32 = mulberry32;
      window.streamParseCSV = streamParseCSV;
      window.autoDetectColumns = autoDetectColumns;
      window.processRealColumns = processRealColumns;
      window.cleanRealDataset = cleanRealDataset;
      window.computeRealEDA = computeRealEDA;
      window.splitRealDataset = splitRealDataset;
    }
    if (typeof module !== 'undefined' && module.exports) {
      module.exports = {
        scoreRow, flattenTree, prepareModelTrees, generate, seededRandom, createGenerator,
        mulberry32, streamParseCSV, autoDetectColumns, processRealColumns, cleanRealDataset,
        computeRealEDA, splitRealDataset
      };
    }
  </script>
</body>
