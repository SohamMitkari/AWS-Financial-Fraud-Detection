<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Financial Fraud Detection System</title>
  <link rel="icon" type="image/jpeg" href="assets/bvplogo.jpeg">
  <style>
    :root {
      --bg: #0b1020;
      --panel: #121a2d;
      --panel2: #18233b;
      --line: #2a3856;
      --text: #eef4ff;
      --muted: #9eabc7;
      --blue: #4d8be8;
      --green: #39d98a;
      --yellow: #f7c948;
      --red: #ff647c;
      --purple: #a88cff
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      overflow: hidden;
      background: linear-gradient(135deg, #080d19, #101a33);
      color: var(--text);
      font: 14px Segoe UI, Arial, sans-serif
    }

    .app {
      display: grid;
      grid-template-columns: 260px 1fr;
      height: 100vh;
      min-height: 0;
      overflow: hidden
    }

    .side {
      padding: 18px;
      background: #090f1e;
      border-right: 1px solid var(--line);
      position: sticky;
      top: 0;
      height: 100vh;
      min-height: 0;
      overflow: auto;
      display: flex;
      flex-direction: column
    }

    .brand {
      font-size: 20px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 10px
    }

    .brand img {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      object-fit: cover
    }

    .muted {
      color: var(--muted);
      font-size: 12px
    }

    .nav {
      margin-top: 20px
    }

    .nav button {
      display: block;
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      text-align: left;
      border: 1px solid transparent;
      border-radius: 9px;
      background: transparent;
      color: #cbd5ed
    }

    .nav button:hover,
    .nav button.active {
      background: #182846;
      border-color: #35578d;
      color: white
    }

    .nav button.done:not(.active) {
      color: #6ce6aa
    }

    .box,
    .card {
      background: rgba(18, 26, 45, .96);
      border: 1px solid var(--line);
      border-radius: 13px;
      padding: 16px;
      margin-bottom: 15px
    }

    .box {
      margin-top: 18px
    }

    .side .box:last-child {
      margin-top: auto;
      position: sticky;
      bottom: 0
    }

    .main {
      padding: 24px 18px;
      max-width: none;
      width: 100%;
      min-width: 0;
      margin: 0;
      height: 100vh;
      min-height: 0;
      overflow: auto
    }

    h1 {
      margin: 0 0 5px;
      font-size: 27px
    }

    h2 {
      font-size: 19px;
      margin: 0 0 8px
    }

    h3 {
      font-size: 15px
    }

    .top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px
    }

    .status {
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #10182a;
      font-size: 12px;
      display: flex;
      align-items: center
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      margin-right: 7px
    }

    .dot.busy {
      background: var(--yellow)
    }

    .dot.err {
      background: var(--red)
    }

    .pills {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 6px;
      margin-bottom: 16px
    }

    .pill {
      padding: 8px 4px;
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: #8190ae;
      font-size: 10px
    }

    .pill.active {
      color: white;
      border-color: var(--blue);
      background: #162849
    }

    .pill.done {
      border-color: #286c51;
      color: #6ce6aa
    }

    .grid {
      display: grid;
      gap: 14px
    }

    .g2 {
      grid-template-columns: repeat(2, 1fr)
    }

    .g3 {
      grid-template-columns: repeat(3, 1fr)
    }

    .g4 {
      grid-template-columns: repeat(4, 1fr)
    }

    .g5 {
      grid-template-columns: repeat(5, 1fr)
    }

    .stage1-kpis {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      width: 100%
    }

    .kpi {
      background: #0f192d;
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 14px
    }

    .klabel {
      color: var(--muted);
      font-size: 11px
    }

    .kvalue {
      font-size: 24px;
      font-weight: 800;
      margin-top: 5px
    }

    .controls {
      display: flex;
      gap: 9px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 13px
    }

    button {
      cursor: pointer
    }

    button.primary,
    button.secondary,
    button.danger {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      color: white;
      font-weight: 700
    }

    button.primary {
      background: #3275d8
    }

    button.secondary {
      background: #263653
    }

    button.danger {
      background: #a93449
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed
    }

    input,
    select {
      background: #0c1425;
      color: white;
      border: 1px solid #344462;
      border-radius: 8px;
      padding: 8px
    }

    .progress {
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #0a1120;
      overflow: hidden;
      margin: 10px 0
    }

    .progress .fill {
      height: 8px;
      width: 0;
      background: linear-gradient(90deg, #3979db, #55c8ff);
      transition: width .08s linear
    }

    .progress-text {
      padding: 8px;
      color: #aebbd5;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .notice {
      padding: 11px;
      border: 1px solid #304467;
      border-radius: 9px;
      color: #bdc9df;
      background: #10192c;
      margin-top: 10px
    }

    .notice.error {
      border-color: #7d3040
    }

    .notice.success {
      border-color: #286c51
    }

    .notice.warn {
      border-color: #735e21
    }

    .tablewrap {
      max-height: 470px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 9px
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
      font-size: 12px
    }

    th,
    td {
      padding: 8px 9px;
      border-bottom: 1px solid #202d47;
      text-align: left;
      white-space: nowrap
    }

    th {
      position: sticky;
      top: 0;
      background: #18243c;
      z-index: 2
    }

    td {
      color: #bcc8dd
    }

    .pager {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      flex-wrap: wrap
    }

    .pager button {
      background: #18243c;
      color: white;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 5px 9px
    }

    .page-buttons {
      display: flex;
      gap: 5px;
      align-items: center;
      flex-wrap: wrap
    }

    .page-buttons button.active {
      background: var(--blue);
      border-color: var(--blue)
    }

    .page-ellipsis {
      padding: 0 2px
    }

    .mini {
      background: #0d1729;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 12px
    }

    .badge {
      display: inline-block;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 800
    }

    .allow,
    .approve {
      background: #123c2b;
      color: #6ce6aa
    }

    .review {
      background: #4b3910;
      color: #ffd66e
    }

    .block {
      background: #4b1723;
      color: #ff8195
    }

    .in-sample,
    .badge.train {
      background: #1e2638;
      color: #8da2fb
    }

    .badge.test {
      background: #162a38;
      color: #64d2ff
    }

    .badge.live {
      background: #3b2314;
      color: #ff9f43
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 35px
    }

    .chart-card {
      min-height: 330px
    }

    .chart-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 10px
    }

    .donut-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      min-height: 245px
    }

    .donut {
      width: 190px;
      height: 190px;
      border-radius: 50%;
      position: relative;
      flex: 0 0 auto
    }

    .donut:after {
      content: "";
      position: absolute;
      width: 104px;
      height: 104px;
      border-radius: 50%;
      background: #111a2f;
      left: 43px;
      top: 43px
    }

    .donut-center {
      position: absolute;
      z-index: 2;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 800
    }

    .donut-center small {
      font-size: 11px;
      color: var(--muted);
      font-weight: 500
    }

    .legend {
      display: flex;
      flex-direction: column;
      gap: 9px;
      min-width: 140px
    }

    .legend button {
      border: 1px solid var(--line);
      background: #10182a;
      color: #dbe5fa;
      border-radius: 8px;
      padding: 8px 9px;
      text-align: left
    }

    .legend button:hover {
      border-color: #557bb6
    }

    .legend i {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 8px
    }

    .bar-list {
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    .bar-row {
      display: grid;
      grid-template-columns: 140px 1fr 70px;
      gap: 8px;
      align-items: center
    }

    .bar-track {
      height: 18px;
      background: #222f48;
      border-radius: 999px;
      overflow: hidden
    }

    .bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width .35s
    }

    .funnel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 8px 0 12px
    }

    .funnel-row {
      height: 36px;
      border-radius: 5px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      column-gap: 12px;
      padding: 0 12px;
      min-width: 170px;
      transition: width .35s;
      border: 1px solid transparent;
      cursor: pointer;
      color: white;
      white-space: nowrap;
      overflow: hidden
    }

    .funnel-row:hover {
      filter: brightness(1.15);
      border-color: #7894c1
    }

    .funnel-row span {
      font-size: 12px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .funnel-row span:last-child {
      min-width: 44px;
      text-align: right
    }

    .funnel-1 {
      background: #315f9e
    }

    .funnel-2 {
      background: #376faa
    }

    .funnel-3 {
      background: #4280bb
    }

    .funnel-4 {
      background: #4d8ed0
    }

    .filter-note {
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px
    }

    .live-table {
      min-width: 720px
    }

    .fraud-popup {
      position: fixed;
      top: 18px;
      right: 18px;
      width: min(390px, calc(100vw - 36px));
      z-index: 99999;
      background: #1a0d14;
      border: 1px solid #ff647c;
      border-left: 6px solid #ff647c;
      border-radius: 12px;
      box-shadow: 0 18px 55px rgba(0, 0, 0, .5);
      padding: 15px;
      transform: translateY(-150%);
      opacity: 0;
      pointer-events: none;
      transition: transform .25s ease, opacity .25s ease
    }

    .fraud-popup.show {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto
    }

    .fraud-popup-title {
      font-weight: 900;
      color: #ff8195;
      font-size: 15px
    }

    .fraud-popup-text {
      margin-top: 6px;
      color: #dfe7f8;
      font-size: 12px;
      line-height: 1.45
    }

    .fraud-popup-close {
      margin-top: 10px;
      background: #3a1721;
      border: 1px solid #703040;
      color: #ffd5dc;
      border-radius: 7px;
      padding: 6px 10px;
      font-size: 11px;
      cursor: pointer
    }

    .visual-svg {
      width: 100%;
      height: 255px;
      display: block
    }

    .visual-segment {
      cursor: pointer;
      transition: opacity .15s, filter .15s
    }

    .visual-segment:hover {
      filter: brightness(1.16)
    }

    .visual-segment.selected {
      filter: brightness(1.25);
      stroke: #fff;
      stroke-width: 2
    }

    .axis-label {
      font-size: 11px;
      fill: #aebbd5
    }

    .axis-value {
      font-size: 11px;
      fill: #dce6fb;
      font-weight: 700
    }

    .chart-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 240px;
      color: var(--muted)
    }

    .tag-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      margin-left: 8px
    }

    .tag-cloud {
      background: #123c2b;
      color: #6ce6aa;
      border: 1px solid #286c51
    }

    .tag-fallback {
      background: #4b3910;
      color: #ffd66e;
      border: 1px solid #735e21
    }

    @media(max-width:950px) {
      .app {
        grid-template-columns: 1fr
      }

      .side {
        position: relative;
        height: auto
      }

      .g5,
      .g4,
      .g3,
      .g2 {
        grid-template-columns: 1fr 1fr
      }

      .stage1-kpis {
        grid-template-columns: repeat(3, minmax(0, 1fr))
      }

      .pills {
        grid-template-columns: repeat(4, 1fr)
      }
    }

    @media(max-width:600px) {
      .main {
        padding: 12px
      }

      .g5,
      .g4,
      .g3,
      .g2 {
        grid-template-columns: 1fr
      }

      .stage1-kpis {
        grid-template-columns: 1fr
      }

      .top {
        flex-direction: column
      }

      .donut-wrap {
        flex-direction: column
      }
    }

    .real-toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
      max-width: 320px;
    }

    .real-toast {
      background: #1a0d14;
      border: 1px solid #ff647c;
      border-left: 5px solid #ff647c;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .5);
      padding: 10px 14px;
      font-size: 13px;
      color: #dfe7f8;
      opacity: 1;
      transform: translateY(0);
      transition: opacity .25s ease, transform .25s ease;
    }

    .real-toast.fade-out {
      opacity: 0;
      transform: translateY(-8px);
    }

    @media (prefers-reduced-motion: reduce) {
      .real-toast {
        transition: none !important;
        transform: none !important;
      }
    }
  </style>
  <script src="config.js"></script>
</head>

<body>
  <div class="app">
    <aside class="side">
      <div class="brand"><img src="assets/bvplogo.jpeg" alt="Logo" onerror="this.style.display='none'">Fraud Detection
        System</div>
      <div id="nav" class="nav"></div>
      <div class="box">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <b>Automatic Pipeline</b>
          <label class="switch"><input id="auto" type="checkbox"><span class="slider"></span></label>
        </div>
        <div class="muted" style="margin-top:8px">Enabling this arms the automated pipeline. Stage 1 starts only after
          you trigger execution; each stage executes dynamic operations, holds briefly for review (skippable), then
          advances.</div>
      </div>
      <div class="box" id="resetBox"><button class="secondary" id="reset" style="width:100%">Reset Pipeline</button>
      </div>
    </aside>

    <main class="main">
      <div class="top">
        <div>
          <h1 id="title"></h1>
          <div id="sub" class="muted"></div>
        </div>
        <div class="status"><span id="dot" class="dot"></span><span id="status">Ready</span></div>
      </div>
      <div id="pills" class="pills"></div>
      <div id="backendBanner"></div>
      <div id="app"></div>
    </main>
  </div>
  <div id="fraudPopup" class="fraud-popup" role="alert" aria-live="assertive">
    <div class="fraud-popup-title">Fraud Detected &amp; Blocked</div>
    <div id="fraudPopupText" class="fraud-popup-text"></div>
    <button id="fraudPopupClose" class="fraud-popup-close" type="button">Dismiss</button>
  </div>

  <script>
    'use strict';

    // 1. API Configuration
    const API_BASE = (window.APP_CONFIG && window.APP_CONFIG.API_BASE) || '';

    const STAGES = [
      'Stage 1: Continuous Data Ingestion',
      'Stage 2: Cleaning and Data Validation',
      'Stage 3: Exploratory Data Analysis',
      'Stage 4: Feature Engineering',
      'Stage 5: Imbalance Handling and Splitting',
      'Stage 6: Model Training and Evaluation',
      'Stage 7: Operational Prediction and Flagging',
      'Dashboard'
    ];
    const DESC = [
      'Generate, append, replace or reset the active transaction dataset.',
      'Inspect nulls, negative values, balance inconsistencies and duplicates, then sanitize the dataset.',
      'Explore transaction mix, fraud distribution and amount exposure.',
      'Compute strictly causal ledger and behavioural history features (zero lookahead leakage).',
      'Create chronological train/test partitions with majority-class undersampling on train for cloud sync.',
      'Train class-weighted LightGBM gradient-boosted trees in AWS Lambda (or verified browser fallback) and evaluate metrics.',
      'Score transactions using exported LightGBM decision trees and assign Approve, Review or Block based on derived thresholds.',
      'Monitor operational triage with live streaming transactions, model predictions and instant auto-blocks.'
    ];
    const RAW_COLS = ['step', 'type', 'amount', 'nameOrig', 'oldbalanceOrg', 'newbalanceOrig', 'nameDest', 'oldbalanceDest', 'newbalanceDest', 'isFraud'];
    const PAGE_SIZE = 1000;
    const EXEC_MS = 1200;
    const REVIEW_HOLD_MS = 3000;

    const state = {
      stage: 0, raw: [], baseRaw: [], clean: null, feat: null, train: null, test: null, score: null, model: null,
      modelSource: 'Not Trained', trainPct: 70, testPct: 30, audit: null,
      datasetMode: 'synthetic', realData: null, realClean: null, realSplits: null, realEDA: null,
      realMetrics: null, realDashboardFilter: null,
      realStream: {
        running: false,
        timer: null,
        currentIndex: 0,
        speed: 5,
        recentRows: [],
        counts: { replayed: 0, Allow: 0, Review: 0, Block: 0, fraudsCaught: 0 }
      },
      executedStages: Array(7).fill(false), running: false, auto: false, autoWaiting: false, live: null, dashboardRefresh: null, liveRows: [], liveIndex: 0,
      liveCausalOrig: new Map(), liveCausalDest: new Map(), liveSeed: 9999991, liveGenerator: null, liveStats: { tp: 0, fp: 0, fn: 0, tn: 0 },
      animation: null, timers: new Set(), runToken: 0, edaSelected: null, stage7Selected: null, dashboardSelected: null,
      fraudPopupTimer: null, dashboardFraudSeen: new Set(), backendError: null
    };

    const $ = id => document.getElementById(id);
    const fmt = x => Number(x || 0).toLocaleString('en-US');
    const money = x => '$' + Number(x || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const esc = x => String(x ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

    function setStatus(t, c = '') {
      $('status').textContent = t;
      $('dot').className = 'dot' + (c ? ' ' + c : '');
    }

    function done(i) {
      return i >= 0 && i < 7 ? state.executedStages[i] === true : false;
    }

    function nav() {
      $('nav').innerHTML = STAGES.map((x, i) =>
        `<button class="${i === state.stage ? 'active' : done(i) ? 'done' : ''}" data-i="${i}">${esc(x)}</button>`
      ).join('');
      [...$('nav').children].forEach(b => b.onclick = () => { if (!state.running) render(+b.dataset.i) });
      $('pills').innerHTML = STAGES.map((x, i) => {
        const label = i === 7 ? 'Dashboard' : `${i + 1}. ${x.replace(/^Stage \d+: /, '')}`;
        return `<div class="pill ${i === state.stage ? 'active' : ''} ${done(i) ? 'done' : ''}">${esc(label)}</div>`;
      }).join('');
    }

    function stopRealStreamReplay() {
      if (state.realStream && state.realStream.timer) {
        clearInterval(state.realStream.timer);
        state.realStream.timer = null;
      }
      if (state.realStream) {
        state.realStream.running = false;
      }
    }

    function clearRealToasts() {
      const container = typeof document !== 'undefined' ? document.getElementById('realToastContainer') : null;
      if (container) {
        container.querySelectorAll('.real-toast').forEach(t => {
          if (t._timer) clearTimeout(t._timer);
          t.remove();
        });
      }
    }

    function stopAllTimers() {
      state.runToken++;
      if (state.animation) cancelAnimationFrame(state.animation);
      state.animation = null;
      [...state.timers].forEach(id => { clearTimeout(id); clearInterval(id) });
      state.timers.clear();
      stopRealStreamReplay();
    }

    function schedule(fn, ms) {
      const id = setTimeout(() => { state.timers.delete(id); fn() }, ms);
      state.timers.add(id);
      return id;
    }

    function resetDownstream() {
      state.executedStages = Array(7).fill(false);
      state.clean = null;
      state.feat = null;
      state.train = null;
      state.test = null;

    function resetToBaseline() {
      stopAllTimers();
      stopLive();
      state.raw = state.baseRaw.map(r => ({ ...r }));
      resetDownstream();
      state.stage = 0;
      state.running = false;

    // 2. Deterministic Seeded Generator with Repeating Accounts and Realistic Risk Overlap
    function seededRandom(seed) {
      let s = seed >>> 0;
      return function () {
        s += 0x6D2B79F5;
        let t = s;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function createGenerator(seed = 20261006, startIndex = 0) {
      const rand = seededRandom(seed);
      const types = ['PAYMENT', 'TRANSFER', 'CASH_OUT', 'DEBIT', 'CASH_IN'];
      const ORIG_POOL = 8000;
      const DEST_POOL = 3000;

      function pickOrig() {
        const idx = Math.floor(Math.pow(rand(), 2.8) * ORIG_POOL);
        return 'C' + (10000000 + idx);
      }
      function pickDest() {
        const idx = Math.floor(Math.pow(rand(), 2.5) * DEST_POOL);
        return 'M' + (20000000 + idx);
      }

      const origBalances = new Map();
      const origHist = new Map();
      const destHist = new Map();
      let globalRowIndex = startIndex;

      function nextRow() {
        const step = Math.floor(globalRowIndex / 24) + 1;
        const hour = step % 24;
        globalRowIndex++;

        const type = types[Math.floor(rand() * types.length)];
        const orig = pickOrig();
        const dest = pickDest();

        let oldO = origBalances.get(orig);
        if (oldO === undefined) {
          oldO = +(rand() * 120000 + 100).toFixed(2);
        }

        let amount;
        if (type === 'PAYMENT' || type === 'DEBIT') {
          amount = +(rand() * 3000 + 5).toFixed(2);
        } else if (type === 'CASH_IN') {
          amount = +(rand() * 40000 + 50).toFixed(2);
        } else {
          amount = +(rand() * 150000 + 50).toFixed(2);
        }

        let newO = Math.max(0, +(oldO - (type === 'CASH_IN' ? -amount : amount)).toFixed(2));
        const drained = (oldO > 0 && newO === 0 && (type === 'TRANSFER' || type === 'CASH_OUT'));

        const oldD = +(rand() * 180000).toFixed(2);
        const newD = +(oldD + (type === 'CASH_IN' ? -amount : amount)).toFixed(2);

        const oData = origHist.get(orig) || { count: 0, total: 0 };
        const priorMean = oData.count > 0 ? (oData.total / oData.count) : amount;
        const dData = destHist.get(dest) || { count: 0 };
        const isNewDest = dData.count === 0;

        // Probabilistic, noisy risk formulation (classes overlap, realistic ~1.3% fraud rate)
        let riskLogit = -6.3;
        if (type === 'TRANSFER') riskLogit += 1.8;
        else if (type === 'CASH_OUT') riskLogit += 1.5;
        else if (type === 'PAYMENT') riskLogit -= 1.8;
        else if (type === 'DEBIT') riskLogit -= 2.0;
        else if (type === 'CASH_IN') riskLogit -= 2.5;

        if (drained) riskLogit += 1.6;
        if (amount > 75000) riskLogit += 0.9;
        if (amount > 180000) riskLogit += 1.3;
        if (priorMean > 0 && amount > priorMean * 2.5) riskLogit += 1.0;
        if (hour >= 1 && hour <= 5) riskLogit += 0.7;
        if (isNewDest && (type === 'TRANSFER' || type === 'CASH_OUT')) riskLogit += 0.6;

        const noise = (rand() + rand() + rand() - 1.5) * 1.8;
        const totalZ = riskLogit + noise;
        const prob = 1.0 / (1.0 + Math.exp(-totalZ));

        let isFraud = prob > 0.5 ? 1 : 0;
        if (rand() < 0.001) isFraud = 1; // sneaky small fraud
        if (isFraud === 1 && (type === 'PAYMENT' || type === 'DEBIT') && rand() < 0.8) isFraud = 0; // legitimate transfer false alarms

        let finalOldO = oldO, finalNewO = newO, finalOldD = oldD, finalNewD = newD;
        // Inject ~0.8% balance continuity errors for Stage 2
        if (rand() < 0.008) {
          finalNewO = +(oldO - amount * 0.45).toFixed(2);
        }
        if (rand() < 0.004) {
          finalNewD = oldD;
        }

        const row = {
          step, type, amount,
          nameOrig: orig, oldbalanceOrg: finalOldO, newbalanceOrig: finalNewO,
          nameDest: dest, oldbalanceDest: finalOldD, newbalanceDest: finalNewD,
          isFraud
        };

        origBalances.set(orig, finalNewO);
        origHist.set(orig, { count: oData.count + 1, total: oData.total + amount });
        destHist.set(dest, { count: dData.count + 1 });

        return row;
      }

      function generateRows(count = 1) {
        const rows = new Array(count);
        for (let i = 0; i < count; i++) {
          rows[i] = nextRow();
        }
        return rows;
      }

      const genInstance = function (count = 1) {
        return generateRows(count);
      };
      genInstance.next = nextRow;
      genInstance.generate = generateRows;
      genInstance.rand = rand;
      genInstance.getIndex = () => globalRowIndex;
      genInstance.setIndex = (idx) => { globalRowIndex = idx; };
      return genInstance;
    }

    function generate(n = 50000, seed = 20261006) {
      const gen = createGenerator(seed);
      const out = gen.generate(n);

      // Inject ~0.4% flaws (null, negative, duplicates) for Stage 2 audit
      const flawCount = Math.max(4, Math.floor(n * 0.005));
      for (let k = 0; k < flawCount; k++) {
        const idx = Math.floor(gen.rand() * n);
        const r = out[idx];
        if (k % 3 === 0) r.amount = -Math.abs(r.amount);
        else if (k % 3 === 1) r.oldbalanceOrg = null;
        else {
          const targetIdx = Math.floor(gen.rand() * n);
          out[idx] = { ...out[targetIdx] };
        }
      }

      return out;
    }

    function parseCSV(text) {
      const rows = []; let row = [], field = '', quoted = false;
      const pushField = () => { row.push(field); field = '' };
      const pushRow = () => { pushField(); if (row.some(v => String(v).trim() !== '')) rows.push(row); row = [] };
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (c === '"') {
          if (quoted && text[i + 1] === '"') { field += '"'; i++ }
          else quoted = !quoted;
        } else if (c === ',' && !quoted) pushField();
        else if ((c === '\n' || c === '\r') && !quoted) { if (c === '\r' && text[i + 1] === '\n') i++; pushRow() }
        else field += c;
      }
      if (field.length || row.length) pushRow();
      if (!rows.length) return [];
      const headers = rows[0].map(x => x.trim());

      // Validate schema
      const required = ['step', 'type', 'amount', 'nameOrig', 'oldbalanceOrg', 'newbalanceOrig', 'nameDest', 'oldbalanceDest', 'newbalanceDest', 'isFraud'];
      const missing = required.filter(k => !headers.includes(k));
      if (missing.length) throw new Error(`CSV Schema Error: Missing required columns [${missing.join(', ')}].`);

      return rows.slice(1).map((vals, rowIdx) => {
        const o = {}; headers.forEach((h, i) => o[h] = vals[i] ?? '');
        ['step', 'amount', 'oldbalanceOrg', 'newbalanceOrig', 'oldbalanceDest', 'newbalanceDest', 'isFraud'].forEach(k => {
          const val = Number(o[k]);
          if (isNaN(val)) throw new Error(`CSV Type Error at row ${rowIdx + 2}: Column '${k}' must be numeric (found '${o[k]}').`);
          o[k] = val;
        });
        return o;
      });
    }

    function downloadCSV(rows) {
      if (!rows.length) return;
      const cols = Object.keys(rows[0]);
      const text = [cols.join(','), ...rows.map(r => cols.map(c => `"${String(r[c] ?? '').replaceAll('"', '""')}"`).join(','))].join('\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv' }));
      a.download = 'fraud_detection_active_dataset.csv';
      a.click();
      schedule(() => URL.revokeObjectURL(a.href), 1000);
    }

    // --- REAL DATASET MODE ENGINE (Stages 1-5) ---

    function mulberry32(a) {
      let s = a >>> 0;
      return function () {
        s += 0x6D2B79F5;
        let t = s;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    async function streamParseCSV(stream, options = {}) {
      const maxRows = options.maxRows || 300000;
      const reader = stream.getReader ? stream.getReader() : null;
      if (!reader) throw new Error('Stream does not support getReader().');
      const decoder = new TextDecoder('utf-8', { stream: true });

      let buffer = '';
      let inQuotes = false;
      let headers = null;
      let rawRowCount = 0;
      let capped = false;

      let colBuffers = null;
      let colNonNumericCounts = null;
      let colBlankCounts = null;
      let colNumericCounts = null;
      const sampleRows = [];
      let capacity = 8192;

      function initColumns(h) {
        headers = h.map(x => x.trim());
        colBuffers = headers.map(() => new Float64Array(capacity));
        colNonNumericCounts = new Array(headers.length).fill(0);
        colBlankCounts = new Array(headers.length).fill(0);
        colNumericCounts = new Array(headers.length).fill(0);
      }

      function expandBuffers(newCap) {
        for (let c = 0; c < headers.length; c++) {
          const newBuf = new Float64Array(newCap);
          newBuf.set(colBuffers[c]);
          colBuffers[c] = newBuf;
        }
        capacity = newCap;
      }

      function addRow(fields) {
        if (rawRowCount >= maxRows) {
          capped = true;
          return false;
        }
        if (rawRowCount >= capacity) {
          const nextCap = Math.min(maxRows, capacity * 2);
          expandBuffers(nextCap);
        }

        const isSample = sampleRows.length < 100;
        const sampleObj = isSample ? {} : null;

        for (let c = 0; c < headers.length; c++) {
          const rawField = fields[c] !== undefined ? fields[c] : '';
          const trimmed = rawField.trim();
          if (trimmed === '') {
            colBuffers[c][rawRowCount] = NaN;
            colBlankCounts[c]++;
            if (isSample) sampleObj[headers[c]] = '';
          } else {
            const num = Number(trimmed);
            if (isNaN(num)) {
              colBuffers[c][rawRowCount] = NaN;
              colNonNumericCounts[c]++;
              if (isSample) sampleObj[headers[c]] = trimmed;
            } else {
              colBuffers[c][rawRowCount] = num;
              colNumericCounts[c]++;
              if (isSample) sampleObj[headers[c]] = num;
            }
          }
        }
        if (isSample) sampleRows.push(sampleObj);
        rawRowCount++;
        if (options.onProgress && rawRowCount % 10000 === 0) {
          options.onProgress(rawRowCount);
        }
        return true;
      }

      let reading = true;
      let field = '';
      let row = [];

      while (reading) {
        const { done, value } = await reader.read();
        if (done) {
          buffer += decoder.decode();
          reading = false;
        } else {
          buffer += decoder.decode(value, { stream: true });
        }

        let i = 0;
        while (i < buffer.length) {
          const c = buffer[i];
          if (c === '"') {
            if (inQuotes) {
              if (i + 1 < buffer.length) {
                if (buffer[i + 1] === '"') {
                  field += '"';
                  i += 2;
                  continue;
                } else {
                  inQuotes = false;
                  i++;
                  continue;
                }
              } else {
                if (reading) {
                  break;
                } else {
                  inQuotes = false;
                  i++;
                  continue;
                }
              }
            } else {
              inQuotes = true;
              i++;
              continue;
            }
          } else if (!inQuotes && c === ',') {
            row.push(field);
            field = '';
            i++;
          } else if (!inQuotes && (c === '\n' || c === '\r')) {
            if (c === '\r' && i + 1 < buffer.length && buffer[i + 1] === '\n') {
              i++;
            } else if (c === '\r' && i + 1 >= buffer.length && reading) {
              break;
            }
            row.push(field);
            field = '';
            i++;
            if (!headers) {
              initColumns(row);
            } else if (row.some(f => f.trim() !== '')) {
              const keepGoing = addRow(row);
              if (!keepGoing) {
                reading = false;
                try { await reader.cancel(); } catch (_) { }
                break;
              }
            }
            row = [];
          } else {
            field += c;
            i++;
          }
        }
        buffer = buffer.slice(i);
      }

      if (field.length > 0 || row.length > 0) {
        row.push(field);
        if (!headers) {
          initColumns(row);
        } else if (row.some(f => f.trim() !== '')) {
          addRow(row);
        }
      }

      if (!headers) throw new Error('Empty CSV file: no header row found.');

      const rawColumns = new Map();
      const nonNumericMap = new Map();
      const blankMap = new Map();
      for (let c = 0; c < headers.length; c++) {
        rawColumns.set(headers[c], colBuffers[c].subarray(0, rawRowCount));
        nonNumericMap.set(headers[c], colNonNumericCounts[c]);
        blankMap.set(headers[c], colBlankCounts[c]);
      }

      return {
        headers,
        rawColumns,
        rawRowCount,
        nonNumericMap,
        blankMap,
        sampleRows,
        capped
      };
    }

    function autoDetectColumns(headers, rawColumns, rawRowCount, nonNumericMap) {
      const labelCandidates = ['label', 'class', 'flag', 'fraud', 'isfraud', 'default', 'default.payment.next.month', 'target'];
      const orderCandidates = ['order', 'time', 'step', 'year', 'timestamp', 'date', 'datetime'];

      const clean = s => s.toLowerCase().replace(/[_\.\s\-]/g, '');

      let detectedLabel = null;
      for (const ln of labelCandidates) {
        const target = clean(ln);
        const m = headers.find(h => clean(h) === target);
        if (m) { detectedLabel = m; break; }
      }

      if (!detectedLabel) {
        for (const h of headers) {
          if (nonNumericMap && nonNumericMap.get(h) > 0) continue;
          const arr = rawColumns.get(h);
          if (!arr) continue;
          let only01 = true;
          let count0 = 0, count1 = 0;
          for (let i = 0; i < rawRowCount; i++) {
            const v = arr[i];
            if (isNaN(v)) continue;
            if (v === 0) count0++;
            else if (v === 1) count1++;
            else { only01 = false; break; }
          }
          if (only01 && (count0 > 0 || count1 > 0)) {
            detectedLabel = h;
            break;
          }
        }
      }
      if (!detectedLabel) detectedLabel = headers[headers.length - 1];

      let detectedOrder = '__none__';
      for (const on of orderCandidates) {
        const target = clean(on);
        const m = headers.find(h => clean(h) === target);
        if (m && m !== detectedLabel) {
          detectedOrder = m;
          break;
        }
      }

      return { labelCol: detectedLabel, orderCol: detectedOrder };
    }

    function processRealColumns(parsedResult, labelCol, orderCol) {
      const { headers, rawColumns, rawRowCount, nonNumericMap, sampleRows, capped } = parsedResult;

      const nonNumericCols = [];
      headers.forEach(h => {
        if (h !== labelCol && h !== orderCol) {
          if (nonNumericMap && nonNumericMap.get(h) > 0) {
            nonNumericCols.push(h);
          }
        }
      });

      const featureCols = headers.filter(h => h !== labelCol && h !== orderCol && !nonNumericCols.includes(h));

      const labelArr = rawColumns.get(labelCol);
      const validIndices = [];
      let fraudCount = 0;

      for (let i = 0; i < rawRowCount; i++) {
        const y = labelArr ? labelArr[i] : NaN;
        if (y === 0 || y === 1) {
          validIndices.push(i);
          if (y === 1) fraudCount++;
        }
      }

      const validArr = new Int32Array(validIndices);
      const droppedRows = rawRowCount - validArr.length;

      return {
        _rawParsed: parsedResult,
        headers,
        rawColumns,
        rawRowCount,
        validIndices: validArr,
        rowCount: validArr.length,
        droppedRows,
        fraudCount,
        labelCol,
        orderCol,
        featureCols,
        nonNumericCols,
        sampleRows,
        capped
      };
    }

    function cleanRealDataset(realData) {
      if (!realData) throw new Error('Load a real dataset in Stage 1 first.');
      const { rawRowCount, validIndices, rawColumns, featureCols } = realData;
      const validRowCount = validIndices.length;

      const missingStats = [];
      const droppedConstantCols = [];
      const cleanFeatureCols = [];

      for (const col of featureCols) {
        const arr = rawColumns.get(col);
        let missing = 0;
        let minVal = Infinity, maxVal = -Infinity;
        for (let i = 0; i < validRowCount; i++) {
          const idx = validIndices[i];
          const v = arr ? arr[idx] : NaN;
          if (isNaN(v)) {
            missing++;
          } else {
            if (v < minVal) minVal = v;
            if (v > maxVal) maxVal = v;
          }
        }
        const pct = validRowCount > 0 ? (missing / validRowCount) * 100 : 0;
        missingStats.push({ col, count: missing, pct });

        const isConstant = (missing === validRowCount) || (minVal === maxVal);
        if (isConstant) {
          droppedConstantCols.push(col);
        } else {
          cleanFeatureCols.push(col);
        }
      }

      missingStats.sort((a, b) => b.pct - a.pct);
      const top10Missing = missingStats.slice(0, 10);

      // Clean sample preview rows (first 100 valid rows)
      const cleanSampleRows = [];
      const limit = Math.min(100, validRowCount);
      for (let i = 0; i < limit; i++) {
        const idx = validIndices[i];
        const obj = {};
        for (const col of cleanFeatureCols) {
          const v = rawColumns.get(col)[idx];
          obj[col] = isNaN(v) ? '' : v;
        }
        if (realData.orderCol && realData.orderCol !== '__none__') {
          const vo = rawColumns.get(realData.orderCol)[idx];
          obj.order = isNaN(vo) ? '' : vo;
        }
        obj.label = rawColumns.get(realData.labelCol)[idx];
        cleanSampleRows.push(obj);
      }

      return {
        rowCount: validRowCount,
        validIndices,
        featureCols: cleanFeatureCols,
        droppedConstantCols,
        missingStats: top10Missing,
        allMissingStats: missingStats,
        cleanSampleRows,
        rowsRead: rawRowCount,
        rowsDropped: realData.droppedRows
      };
    }

    function computeRealEDA(realData, cleanFeatureCols) {
      if (!realData) throw new Error('Load a real dataset first.');
      const { validIndices, rawColumns, labelCol } = realData;
      const N = validIndices.length;
      const labelArr = rawColumns.get(labelCol);

      let count0 = 0, count1 = 0;
      for (let i = 0; i < N; i++) {
        const idx = validIndices[i];
        const y = labelArr ? labelArr[idx] : NaN;
        if (y === 1) count1++;
        else if (y === 0) count0++;
      }
      const prevalence = N > 0 ? (count1 / N) * 100 : 0;

      const separationList = [];
      for (const col of cleanFeatureCols) {
        const arr = rawColumns.get(col);
        if (!arr) continue;
        let s0 = 0, ss0 = 0, n0 = 0;
        let s1 = 0, ss1 = 0, n1 = 0;
        for (let i = 0; i < N; i++) {
          const idx = validIndices[i];
          const v = arr[idx];
          if (isNaN(v)) continue;
          const y = labelArr[idx];
          if (y === 1) { s1 += v; ss1 += v * v; n1++; }
          else if (y === 0) { s0 += v; ss0 += v * v; n0++; }
        }
        const m0 = n0 > 0 ? s0 / n0 : 0;
        const m1 = n1 > 0 ? s1 / n1 : 0;
        const v0 = n0 > 1 ? (ss0 - (s0 * s0) / n0) / (n0 - 1) : 0;
        const v1 = n1 > 1 ? (ss1 - (s1 * s1) / n1) / (n1 - 1) : 0;
        const pooledSd = Math.sqrt((v0 + v1) / 2) || 1e-9;
        const d = Math.abs(m1 - m0) / pooledSd;
        separationList.push({ col, separation: d, m0, m1 });
      }

      separationList.sort((a, b) => b.separation - a.separation);
      const top10 = separationList.slice(0, 10);

      return {
        count0,
        count1,
        prevalence,
        top10
      };
    }

    function splitRealDataset(N, orderArray = null, seed = 42) {
      const indices = new Int32Array(N);
      for (let i = 0; i < N; i++) indices[i] = i;

      let splitMode = 'seeded';
      if (orderArray) {
        splitMode = 'chronological';
        const arr = Array.from(indices);
        arr.sort((a, b) => {
          const va = orderArray[a], vb = orderArray[b];
          if (isNaN(va) && isNaN(vb)) return 0;
          if (isNaN(va)) return 1;
          if (isNaN(vb)) return -1;
          return va - vb;
        });
        for (let i = 0; i < N; i++) indices[i] = arr[i];
      } else {
        splitMode = 'seeded';
        const rand = mulberry32(seed);
        for (let i = N - 1; i > 0; i--) {
          const j = Math.floor(rand() * (i + 1));
          const tmp = indices[i];
          indices[i] = indices[j];
          indices[j] = tmp;
        }
      }

      const nTrain = Math.floor(N * 0.70);
      const nTest = N - nTrain;
      const nVal = Math.floor(nTrain * 0.20);
      const nFit = nTrain - nVal;

      return {
        fit: indices.subarray(0, nFit),
        val: indices.subarray(nFit, nTrain),
        train: indices.subarray(0, nTrain),
        test: indices.subarray(nTrain),
        splitMode,
        sizes: { N, nTrain, nTest, nVal, nFit }
      };
    }

    function executeReal(i) {
      if (i === 0) {
        if (!state.realData) throw new Error('Upload and configure a real dataset CSV in Stage 1 first.');
        resetDownstream();
      } else if (i === 1) {
        if (!state.realData) throw new Error('Load a real dataset in Stage 1 first.');
        state.realClean = cleanRealDataset(state.realData);
      } else if (i === 2) {
        if (!state.realClean) throw new Error('Run Stage 2 cleaning first.');
        state.realEDA = computeRealEDA(state.realData, state.realClean.featureCols);
      } else if (i === 3) {
        if (!state.realClean) throw new Error('Run Stage 2 cleaning first.');
        // Stage 4: Numeric passthrough
        state.realFeat = state.realClean;
      } else if (i === 4) {
        if (!state.realClean) throw new Error('Run Stage 2 cleaning first.');
        const N = state.realClean.rowCount;
        const validIndices = state.realClean.validIndices;
        const orderCol = state.realData.orderCol;
        let orderSubarray = null;
        if (orderCol && orderCol !== '__none__') {
          const rawOrderArr = state.realData.rawColumns.get(orderCol);
          orderSubarray = new Float64Array(N);
          for (let idx = 0; idx < N; idx++) {
            orderSubarray[idx] = rawOrderArr[validIndices[idx]];
          }
        }

        const splitRes = splitRealDataset(N, orderSubarray, 42);
        const labelArr = state.realData.rawColumns.get(state.realData.labelCol);

        function getSliceStats(subIdxs) {
          let pos = 0;
          for (let idx = 0; idx < subIdxs.length; idx++) {
            const origIdx = validIndices[subIdxs[idx]];
            if (labelArr[origIdx] === 1) pos++;
          }
          return {
            rows: subIdxs.length,
            pos,
            prev: subIdxs.length ? (pos / subIdxs.length) * 100 : 0
          };
        }

        state.realSplits = {
          fit: splitRes.fit,
          val: splitRes.val,
          train: splitRes.train,
          test: splitRes.test,
          splitMode: splitRes.splitMode,
          sizes: splitRes.sizes,
          stats: {
            fit: getSliceStats(splitRes.fit),
            val: getSliceStats(splitRes.val),
            train: getSliceStats(splitRes.train),
            test: getSliceStats(splitRes.test),
            total: getSliceStats(new Int32Array(N).map((_, idx) => idx))
          }
        };
      } else if (i === 5) {
        if (!state.realSplits) throw new Error('Run Stage 5 partitioning first.');
      } else if (i === 6) {
        if (!state.model || !state.realMetrics) {
          throw new Error('Train a model in Stage 6 first.');
        }
        state.executedStages[6] = true;
      }
    }

    function stage1Real() {
